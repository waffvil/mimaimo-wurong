<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3ec"/>
      <stop offset="0.55" stop-color="#ffd9e0"/>
      <stop offset="1" stop-color="#ffe9d6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- soft scattered sparkles -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="96" cy="120" r="4"/>
    <circle cx="420" cy="150" r="5"/>
    <circle cx="130" cy="400" r="5"/>
    <circle cx="400" cy="390" r="4"/>
  </g>
  <!-- monogram -->
  <text x="256" y="315" text-anchor="middle"
        font-family="Snell Roundhand, 'Brush Script MT', cursive"
        font-size="140" font-weight="700" fill="#d8698a">M<tspan font-size="78" fill="#e58aa4" dy="-22">♡</tspan><tspan dy="22">V</tspan></text>
</svg>
