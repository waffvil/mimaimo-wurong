  <!-- M♡V in Gochi Hand, converted to OUTLINES (fontTools) so this file needs no font to render
       anywhere — an app icon gets opened by tooling that has never heard of a web font.
       Letters 218px, laid out by their real ink boxes rather than their advance widths, so the
       lockup is centred on what you actually see. The heart is the app's own drawn heart, the same
       shape as the ones on the board's curtain. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3ec"/>
      <stop offset="0.55" stop-color="#ffd9e0"/>
      <stop offset="1" stop-color="#ffe9d6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
