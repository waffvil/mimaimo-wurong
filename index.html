          : "driftUp " + (17 + Math.random() * 13).toFixed(1) + "s linear " + (Math.random() * 14).toFixed(1) + "s infinite"
      }) + '">' + fc + "</span>";
    }
    var corners =
      '<span class="wall-corner" style="top:22px;left:24px;">❀</span>' +
      '<span class="wall-corner" style="top:22px;right:24px;">❀</span>' +
      '<span class="wall-corner" style="bottom:22px;left:24px;">♡</span>' +
      '<span class="wall-corner" style="bottom:22px;right:24px;">♡</span>';

    var SINCE = togetherText();
    var nowV = thisMonthView();
    var isThisMonth = !monthView.all && monthView.y === nowV.y && monthView.m === nowV.m;
    // phone-only cute chrome (scalloped pink banner + ears round the island + the pinned dotted frame).
    // Hidden on desktop via CSS; the desktop keeps the plain .wall-frame.
    // The curtain/hearts/ears are the shared #chrome element now — the board only owns its own frame.
    var phoneChrome =
      '<div class="wall-safebot"></div>' +
      '<div class="wall-pinframe"><span class="ws-heart ws-hl">♡</span><span class="ws-heart ws-hr">♡</span></div>';
    wallEl.innerHTML =
      '<div class="wall-floaters">' + floaters + "</div>" +
      '<div class="wall-frame"></div>' + corners + phoneChrome +
      '<div class="wall-rail">' +
        '<button class="wall-icon' + (lettersForMe().length ? " on" : "") + '" id="wallLetters" ' +
          'title="our letters" aria-label="our letters">' + envelopeIcon() + "</button>" +
        '<button class="wall-icon' + (monthView.all || !isThisMonth ? " on" : "") + '" id="wallCal" ' +
          'title="pick a month" aria-label="pick a month">' + calendarIcon() + "</button>" +
      "</div>" +
      '<button class="wall-add" id="wallAdd" title="add a note"><span>+</span></button>' +
      '<button class="wall-place" id="wallPlace">place it here ♡</button>' +
      '<div class="wall-inner">' +
        '<div class="wall-sheet">' +
          '<div class="wall-head">' +
            '<div class="wall-deco">⋆˚ ୨♡୧ ˚⋆</div>' +
            '<div class="wall-title">our note wall</div>' +
            '<div class="wall-count">' + escW(viewLabel(NOTES.length)) + "</div>" +
            '<div class="wall-since' + (SINCE.special ? " today" : "") + '">' + escW(SINCE.text) + "</div>" +
          "</div>" +
          '<div class="wall-notes" id="wallNotes"></div>' +
        "</div>" +
      "</div>" +
      '<div class="wall-modal" id="wallModal"></div>';

    var wallNotes = document.getElementById("wallNotes");
    var bw = wallNotes.clientWidth || 340;
    var bh = wallNotes.clientHeight || 500;
    var noteW = Math.min(190, Math.max(148, bw * 0.44));

    if (!renderWall._ctx) renderWall._ctx = document.createElement("canvas").getContext("2d");
    var ctx = renderWall._ctx;
    ctx.font = "14px " + WFONT;
    function lineCount(str, w) {
      var total = 0, paras = (str || "").split("\n");
      for (var pi = 0; pi < paras.length; pi++) {
        var words = paras[pi].split(" "), cur = "", lc = 1;
        for (var wi = 0; wi < words.length; wi++) {
          var word = words[wi];
          while (ctx.measureText(word).width > w) {          // break a very long unbroken word
            var k = 1; while (k < word.length && ctx.measureText(word.slice(0, k + 1)).width <= w) k++;
            if (cur) { lc++; } lc++; cur = ""; word = word.slice(k);
          }
          var next = cur ? cur + " " + word : word;
          if (ctx.measureText(next).width > w && cur) { lc++; cur = word; } else cur = next;
        }
        total += lc;
      }
      return total;
    }

    // any note without a saved spot gets a tidy starting position (x, y are both % of the board)
    (function ensurePos() {
      var cols = bw < 520 ? 2 : (bw < 820 ? 3 : 4), placed = 0;
      for (var k = 0; k < NOTES.length; k++) {
        var nn = NOTES[k];
        if (nn.x == null || nn.y == null) {
          var c = placed % cols, r = Math.floor(placed / cols);
          nn.x = cols === 1 ? 50 : 14 + c * (72 / (cols - 1));
          nn.y = 8 + r * 26;
          placed++;
        }
      }
    })();

    // phone: notes can't be placed/moved — they present systematically, in the order a
    // left→right, top→bottom scan of the desktop board hits them, then stack straight down.
    // the WHOLE board scrolls as one page (see the max-width media query); only the + stays pinned.
    var PHONE = isPhone();
    wallNotes.classList.toggle("stack", PHONE);
    if (PHONE) NOTES.forEach(function (n) { n.locked = true; });
    var order = NOTES.map(function (n, i) { return i; });
    if (PHONE) {
      var scan = NOTES.map(function (n, i) { return { i: i, x: n.x == null ? 0 : n.x, y: n.y == null ? 0 : n.y }; });
      scan.sort(function (a, b) { return a.y - b.y; });          // top → bottom
      var srows = [], scur = null, stol = 14;                    // notes within 14% of each other in y = one row
      scan.forEach(function (o) { if (!scur || o.y > scur.top + stol) { scur = { top: o.y, items: [] }; srows.push(scur); } scur.items.push(o); });
      order = [];
      srows.forEach(function (r) { r.items.sort(function (a, b) { return a.x - b.x; }); r.items.forEach(function (o) { order.push(o.i); }); }); // left → right within each row
    }

    // mobile layout is in pixels (the page scrolls, so it can't lean on a fixed board height):
    // two edge-hugging columns, rows stepping down and overlapping a little.
    var pW = [], pRowTop = [], pMargin = Math.round(bw * 0.05);   // side gap so notes don't hug the frame
    // Where the outer edge of a column may sit, measured from the screen. The container itself starts 22px
    // in (the sheet's 8px margin + 14px padding), measured rather than assumed so changing that padding
    // can't quietly break this.
    var pHostLeft = 22;
    if (PHONE) {
      var hl = wallNotes.getBoundingClientRect().left - wallEl.getBoundingClientRect().left;
      if (hl > 0) pHostLeft = hl;
    }
    // A note is TILTED, so its corners stick out sideways past its own width — by w*(cos+sin-1)/2, which
    // is ~5px for a 3° lean and ~11px for a 6.7° one (6° of tilt plus the sway's extra 0.7°). Pulling every
    // note out by the same amount therefore left the leaniest ones touching the border while the straight
    // ones had room to spare. Each note now gets exactly the room its own lean needs, so all of them clear
    // the frame by the same 4px and none of them is further in than it has to be.
    var FRAME_INNER = 10, FRAME_CLEAR = 4;
    function tiltPad(w, tiltDeg) {
      var t = (Math.abs(tiltDeg) + 0.7) * Math.PI / 180;
      return w * (Math.cos(t) + Math.sin(t) - 1) / 2;
    }
    
    // GAPS ARE NOT ALLOWED. Every note must overlap its neighbour across and the note below it, and when
    // the natural sizes don't reach, the notes GROW until they do. Two "small" notes side by side simply
    // don't span a phone — that is where the bare strip down the middle came from.
    var MIN_OVL = 14;
    if (PHONE) {
      var pS = order.map(function (idx) { return resolveNoteStyle(NOTES[idx]); });
      pW = pS.map(function (st) { return Math.round(noteW * ({ s: 1, m: 1, l: 1.26 }[st.size] || 1)); });
      var wallW = bw + pHostLeft * 2;      // the screen: the container plus its equal margins

      // --- across: grow each pair until the columns genuinely overlap.
      // The inset a note needs depends on its lean AND its width, and the width is what we're solving for,
      // so this converges instead of computing it once: widen, re-measure the inset, check again.
      for (var rr = 0; rr * 2 + 1 < order.length; rr++) {
        var iA = rr * 2, iB = iA + 1;
        for (var pass = 0; pass < 4; pass++) {
          var need = wallW + MIN_OVL
            - (FRAME_INNER + FRAME_CLEAR + tiltPad(pW[iA], pS[iA].tilt))
            - (FRAME_INNER + FRAME_CLEAR + tiltPad(pW[iB], pS[iB].tilt));
          var have = pW[iA] + pW[iB];
          if (have >= need) break;
          var k = need / have;                       // scale both, so a large note stays larger
          pW[iA] = Math.ceil(pW[iA] * k);
          pW[iB] = Math.ceil(pW[iB] * k);
        }
      }

      // --- down: a row may only step as far as its SHORTER note allows, or that note leaves a gap under
      // itself. Otherwise keep the roomier 0.88 spacing.
      var accY = 20;                        // a little air under the header before the first row
      for (var rr2 = 0; rr2 * 2 < order.length; rr2++) {
        pRowTop[rr2] = accY;
        var hA = pW[rr2 * 2], hB = pW[rr2 * 2 + 1];
        var step = hB == null ? hA                                    // lone last note: nothing below it
          : Math.min(Math.max(hA, hB) * 0.88, Math.min(hA, hB) - MIN_OVL);
        accY += Math.max(40, Math.round(step));
      }
    }

    renderWall._meta = [];
    var html = "", pBottom = 0;
    for (var oi = 0; oi < order.length; oi++) {
      var i = order[oi], n = NOTES[i], s = resolveNoteStyle(n);
      var szf = { s: 1, m: 1, l: 1.26 }[s.size] || 1;         // "small"=medium size, "large"=bigger
      var nW = PHONE ? pW[oi] : Math.round(noteW * szf), noteH = nW;   // square (keeps drawings undistorted)
      // Layering just counts up: 1 2 | 3 4 | 5 6 | 7 8, each note in front of the one before, so every row
      // lies on top of the row above it all the way down.
      var wrap = { position: "absolute", width: nW + "px", zIndex: 10 + oi, transformOrigin: "center", "--tilt": s.tilt.toFixed(1) + "deg", transform: "rotate(" + s.tilt.toFixed(1) + "deg)", animation: "swayNote " + (5 + (hshW(n.body) % 40) / 10).toFixed(1) + "s ease-in-out infinite" };
      if (PHONE) {
        var c = oi % 2, r = Math.floor(oi / 2);
        // anchor left column by its LEFT edge, right column by its RIGHT edge — the browser fixes
        // each margin against the real container, so the right edge can never overshoot the frame.
        // Both columns sit as far out as their lean allows (see tiltPad) — a negative offset, because the
        // container starts further in than the frame does. This is also what opens up the middle: the two
        // columns used to overlap by 51px on a 393px screen.
        var pOut = Math.round(FRAME_INNER + FRAME_CLEAR + tiltPad(nW, s.tilt) - pHostLeft);
        if (c === 0) wrap.left = pOut + "px"; else wrap.right = pOut + "px";
        wrap.top = pRowTop[r] + "px";
        pBottom = Math.max(pBottom, pRowTop[r] + noteH);
      } else {
        wrap.left = Math.round(Math.max(0, Math.min(bw - nW, n.x / 100 * bw - nW / 2))) + "px";
        wrap.top = Math.round(Math.max(0, Math.min(bh - noteH, n.y / 100 * bh))) + "px"; // desktop: saved, draggable spot
      }

      renderWall._meta.push({ body: n.body, author: n.author, bg: noteCardBg(s), ink: WPADS[s.color].ink, curved: s.curved });
      html += '<div class="wnote' + (n.locked === false ? " movable" : "") + '" data-i="' + i + '" style="' + stW(wrap) + '">' + noteInner(s, n.body, n.author, noteH, noteDate(n.created_at)) + "</div>";
    }
    // spacer sets the scroll height. It ends EXACTLY at the last note's bottom edge — any trailing room
    // here shows up as a blank pale strip under the last note when scrolled to the end (the "white bar").
    if (PHONE) html += '<div style="position:relative;width:1px;height:' + pBottom + 'px;pointer-events:none"></div>';
    // A month with nothing in it is the point of the reset, not a fault — say so, and say where the rest went.
    if (!NOTES.length) {
      html = '<div class="wall-empty"><b>' + (monthView.all ? "no notes yet" : "a fresh month ♡") + "</b>" +
        (monthView.all ? "leave the first one with the ✚"
          : "nothing pinned here yet — leave the first one with the ✚, or tap the calendar to look back") +
        "</div>";
    }
    wallNotes.innerHTML = html;

    document.getElementById("wallAdd").addEventListener("click", showAdd);
    document.getElementById("wallCal").addEventListener("click", function () { openCalendar(); });
    document.getElementById("wallLetters").addEventListener("click", function () { showLetters(); });

    // Notifications live on the settings screen now (arm the heart on the lock screen to get there). This
    // still runs on every board render, and it is what keeps this phone's registration alive.
    resyncPush();
    // keep the letter count fresh so the envelope's bead is honest; redraw the rail if it changed
    if (!renderWall._lettersOnce) {
      renderWall._lettersOnce = true;
      loadLetters().then(function () {
        if (lettersForMe().length && wallEl.classList.contains("show")) {
          var b = document.getElementById("wallLetters");
          if (b) b.classList.add("on");
        }
      });
    }

    // ----- drag to place · tap to open -----
    var modal = document.getElementById("wallModal");
    function closeModal() { modal.classList.remove("open"); modal.innerHTML = ""; }

    // The month picker. Months only — no day grid — because notes belong to a month here, and picking a
    // single day would hide almost everything almost always.
    function openCalendar(redraw) {
      var counts = monthCounts(WALL_NOTES);
      var lcounts = monthCounts(LETTERS);        // the same helper — both tables carry created_at
      // years worth offering: every year that holds a note, plus the one we are in
      var years = {};
      Object.keys(counts).forEach(function (k) { years[+k.split("-")[0]] = 1; });
      Object.keys(lcounts).forEach(function (k) { years[+k.split("-")[0]] = 1; });
      years[nowV.y] = 1;
      var yList = Object.keys(years).map(Number).sort(function (a, b) { return a - b; });
      var shownYear = monthView.all ? nowV.y : monthView.y;

      function draw() {
        var cells = "";
        for (var m = 0; m < 12; m++) {
          var n = counts[shownYear + "-" + m] || 0;
          var lt = lcounts[shownYear + "-" + m] || 0;
          var sel = !monthView.all && monthView.y === shownYear && monthView.m === m;
          var isNow = shownYear === nowV.y && m === nowV.m;
          // a month counts as having something if it holds notes OR letters; tapping still filters the
          // board, and a letters-only month honestly shows an empty board with the letters one tap away
          var has = n || lt;
          cells += '<button class="cal-m' + (sel ? " sel" : "") + (has ? "" : " empty") + (isNow ? " now" : "") +
            '" data-m="' + m + '"' + (has || isNow ? "" : " disabled") + ">" + MONTHS_SHORT[m] +
            '<span class="n">' + (n ? n + (n === 1 ? " note" : " notes") : "—") + "</span>" +
            (lt ? '<span class="n lt">' + lt + (lt === 1 ? " letter" : " letters") + "</span>" : "") +
          "</button>";
        }
        var yi = yList.indexOf(shownYear);
        modal.innerHTML =
          '<div class="cal-card">' +
            '<div class="cal-title">our months</div>' +
            '<div class="cal-sub">every note is still here — pick a month ♡</div>' +
            '<div class="cal-year">' +
              '<button class="cal-arrow" data-y="-1"' + (yi <= 0 ? " disabled" : "") + ">‹</button>" +
              "<span>" + shownYear + "</span>" +
              '<button class="cal-arrow" data-y="1"' + (yi >= yList.length - 1 ? " disabled" : "") + ">›</button>" +
            "</div>" +
            '<div class="cal-grid">' + cells + "</div>" +
            '<button class="cal-all' + (monthView.all ? " sel" : "") + '" id="calAll">every note, all of it ♡</button>' +
            '<button class="cal-close">close</button>' +
          "</div>";
        modal.classList.add("open");
      }

      // the letter counts come from a table the board may not have fetched yet — top it up, then redraw

      modal.onclick = function (e) {

          return;
        }

          monthView = { all: true, y: shownYear, m: nowV.m };

        }
        var cell = e.target.closest(".cal-m");
        if (cell && !cell.disabled) {
          monthView = { all: false, y: shownYear, m: +cell.getAttribute("data-m") };

        }
      };
    }

    function openNoteModal(idx) {
      var n = NOTES[idx], s = resolveNoteStyle(n);
      var size = Math.round(Math.min(window.innerWidth * 0.82, 380));
      modal.innerHTML =
        '<div class="wm-stage">' +
          '<div class="wm-note-box" style="position:relative;width:' + size + 'px;height:' + size + 'px">' +
            noteInner(s, n.body, n.author, size, noteDate(n.created_at)) +
          "</div>" +
          '<div class="wm-tools">' +
            '<button class="wm-tool" data-act="close" title="close">✕</button>' +
            (PHONE ? "" : '<button class="wm-tool" data-act="move" title="move it">✥</button>') +
            '<button class="wm-tool" data-act="edit" title="edit">✎</button>' +

          '</div>' +
        '</div>';
      modal.classList.add("open");
      modal.onclick = function (e) {
        var t = e.target.closest(".wm-tool");
        if (t) {
          var a = t.getAttribute("data-act");

          else if (a === "move") { closeModal(); unlockNote(idx); }
          else if (a === "edit") { closeModal(); editNote(idx); }

          return;
        }
        if (e.target === modal) closeModal(); // tap backdrop to close
      };
    }
    function deleteNote(idx) {
      var n = NOTES[idx], w = WALL_NOTES.indexOf(n);
      if (w >= 0) WALL_NOTES.splice(w, 1);
      deleteNoteDb(n);            // remove from Supabase (no-op if it had no id yet)
      renderWall();
    }
    function editNote(idx) {
      var n = NOTES[idx], s = resolveNoteStyle(n);
      editingNote = n;
      addDraft = { body: n.body, author: n.author, color: s.color, inkColor: s.inkColor >= 0 ? s.inkColor : 0, paper: s.paper, edge: s.curved ? "curved" : "sharp", folded: s.folded, doodle: s.doodle, fasten: s.fasten, pin: s.pin, pinColor: s.pinColor, tape: s.tape, tapePat: s.tapePat, tilt: s.tilt, size: s.size, strokes: (n.strokes || []).map(function (st) { return { color: st.color, w: st.w, pts: st.pts.slice() }; }) };
      showAdd();
    }

    // make note `idx` the single movable one (locks all the others)
    var placeBtn = document.getElementById("wallPlace");
    placeBtn.addEventListener("click", relockAll);
    function unlockNote(idx) {
      for (var k = 0; k < NOTES.length; k++) NOTES[k].locked = k !== idx;
      var els = wallNotes.querySelectorAll(".wnote");
      for (var j = 0; j < els.length; j++) els[j].classList.toggle("movable", +els[j].getAttribute("data-i") === idx);
      placeBtn.classList.add("show");
    }
    // lock everything again (confirm placement, or clicking off the movable note)
    function relockAll() {
      for (var k = 0; k < NOTES.length; k++) NOTES[k].locked = true;
      var els = wallNotes.querySelectorAll(".wnote.movable");
      for (var j = 0; j < els.length; j++) els[j].classList.remove("movable");
      placeBtn.classList.remove("show");
    }
    if (NOTES.some(function (n) { return n.locked === false; })) placeBtn.classList.add("show"); // a just-added note is already movable

    var drag = null;
    wallNotes.addEventListener("pointerdown", function (e) {
      var el = e.target.closest(".wnote");

      var idx = +el.getAttribute("data-i");
      if (NOTES[idx].locked !== false) relockAll();  // clicked a different (locked) note → lock the movable one
      drag = { el: el, idx: idx, sx: e.clientX, sy: e.clientY, ol: parseFloat(el.style.left), ot: parseFloat(el.style.top), w: el.offsetWidth, moved: false, movable: NOTES[idx].locked === false };
      el.setPointerCapture(e.pointerId);

    });
    wallNotes.addEventListener("pointermove", function (e) {
      if (!drag) return;
      var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;

      if (!drag.movable || !drag.moved) return;
      var maxTop = wallNotes.clientHeight - drag.el.offsetHeight;
      drag.el.style.left = Math.max(0, Math.min(bw - drag.w, drag.ol + dx)) + "px";
      drag.el.style.top = Math.max(0, Math.min(maxTop, drag.ot + dy)) + "px";
    });
    function endDrag() {
      if (!drag) return;

      if (d.movable) {
        d.el.style.cursor = ""; d.el.style.zIndex = 10 + d.idx;
        if (d.moved) {
          var left = parseFloat(d.el.style.left), top = parseFloat(d.el.style.top);
          NOTES[d.idx].x = (left + d.w / 2) / bw * 100;   // % of board width
          NOTES[d.idx].y = top / bh * 100;                 // % of board height
          patchNote(NOTES[d.idx], { x: NOTES[d.idx].x, y: NOTES[d.idx].y }); // persist the move
        } else {
          openNoteModal(d.idx);                            // tapped the movable note → just read it
        }

        openNoteModal(d.idx);                              // tap a locked note → open it (use the move ✥ tool to unlock)
      }
    }
