      renderWall._meta.push({ body: n.body, author: n.author, bg: noteCardBg(s), ink: WPADS[s.color].ink, curved: s.curved });
      html += '<div class="wnote' + (n.locked === false ? " movable" : "") + '" data-i="' + i + '" style="' + stW(wrap) + '">' + noteInner(s, n.body, n.author, noteH) + "</div>";
    }
    // spacer sets the scroll height. It ends EXACTLY at the last note's bottom edge — any trailing room
    // here shows up as a blank pale strip under the last note when scrolled to the end (the "white bar").
    if (PHONE) html += '<div style="position:relative;width:1px;height:' + pBottom + 'px;pointer-events:none"></div>';
    wallNotes.innerHTML = html;

    document.getElementById("wallAdd").addEventListener("click", showAdd);

    // Notifications have no button on the board any more — they move to the settings screen. The sheet
    // itself is kept and still works: openPushSheet() is what that screen will call, and #notif on the URL
    // opens it in the meantime. This keeps this phone's registration fresh either way.
    resyncPush();
    if (/[?&#]notif\b/.test(location.search + location.hash)) setTimeout(openPushSheet, 0);

    // ----- drag to place · tap to open -----
    var modal = document.getElementById("wallModal");
    function closeModal() { modal.classList.remove("open"); modal.innerHTML = ""; }

    // The notifications sheet. Lives here (rather than beside the push helpers) because it needs `modal`.
    function openPushSheet(onChange) {
      var pick = pushWho || EM;
      var on = !!pushWho;               // synchronous: the sheet must open on the tap, always
      var tpick = ANH;                  // which phone the desktop test ping goes to
      modal.innerHTML =
        '<div class="pn-card">' +
          "<h3>notifications</h3>" +
          "<p>a little ping on this phone whenever the other one pins a note ♡</p>" +
          (on ? "" :
            '<div class="pn-label">this phone belongs to</div>' +
            '<div class="pn-who">' +
              '<button data-who="' + escW(EM) + '">em yêu (M)</button>' +
              '<button data-who="' + escW(ANH) + '">anh yêu (V)</button>' +
            "</div>") +
          '<button class="pn-go' + (on ? " off" : "") + '" id="pnGo">' +
            (on ? "turn them off" : "turn them on") + "</button>" +
          '<div class="pn-msg" id="pnMsg">' +
            (pushSupported() ? "" : (pushInstalled()
              ? "this iOS is too old for web notifications (needs 16.4+)"
              : "add M+V to your Home Screen first — iOS only allows notifications for installed apps")) +
          "</div>" +
          // Test ping — hidden, because notifications are confirmed working and this doesn't belong in the
          // sheet day to day. Add #ping to the URL on a desktop to bring it back (the whole chain is still
          // deployed and tested, so this stays as the diagnostic for "did a push get through?").
          (PHONE || !/[?&#]ping\b/.test(location.search + location.hash) ? "" :
            '<div class="pn-sep"></div>' +
            '<div class="pn-label">only one phone? ping it from here</div>' +
            '<div class="pn-who pn-twho">' +
              '<button data-twho="' + escW(EM) + '">em yêu\'s phone</button>' +
              '<button data-twho="' + escW(ANH) + '">anh yêu\'s phone</button>' +
            "</div>" +
            '<button class="pn-go off" id="pnTest">send a test ping</button>' +
            '<div class="pn-msg" id="pnTestMsg"></div>') +
          '<button class="pn-close">close</button>' +
        "</div>";
      modal.classList.add("open");

      var msg = document.getElementById("pnMsg");
      var go = document.getElementById("pnGo");
      var test = document.getElementById("pnTest");
      var testMsg = document.getElementById("pnTestMsg");
      function sel() {
        [].forEach.call(modal.querySelectorAll(".pn-who:not(.pn-twho) button"), function (b) {
          b.classList.toggle("sel", b.getAttribute("data-who") === pick);
        });
        [].forEach.call(modal.querySelectorAll(".pn-twho button"), function (b) {
          b.classList.toggle("sel", b.getAttribute("data-twho") === tpick);
        });
      }
      sel();
      function say(text, bad) { msg.textContent = text; msg.classList.toggle("bad", !!bad); }
      function sayTest(text, bad) { testMsg.textContent = text; testMsg.classList.toggle("bad", !!bad); }

      modal.onclick = function (e) {
        if (e.target === modal || e.target.classList.contains("pn-close")) { closeModal(); return; }
        var t = e.target.closest(".pn-twho button");
        if (t) { tpick = t.getAttribute("data-twho"); sel(); return; }
        var w = e.target.closest(".pn-who:not(.pn-twho) button");
        if (w) { pick = w.getAttribute("data-who"); sel(); return; }

        if (e.target === test) {
          test.disabled = true;
          sayTest("sending…");
          sendTestPing(tpick)
            .then(function (r) {
              test.disabled = false;
              sayTest(r.sent
                ? "sent to " + r.sent + " device" + (r.sent === 1 ? "" : "s") + " — look at the phone ♡"
                : "nothing to send to: " + tpick + "'s phone hasn't turned notifications on yet", !r.sent);
            })
            .catch(function (err) {
              test.disabled = false;
              sayTest((err && err.message) || "couldn't reach the server", true);
            });
          return;
        }
        if (e.target !== go) return;

        go.disabled = true;
        say(on ? "turning off…" : "asking iOS…");
        (on ? disablePush() : enablePush(pick))
          .then(function () {
            if (onChange) onChange();
            say(on ? "off — no more pings on this phone" : "done ♡ you'll get a ping when " +
              (pick === EM ? ANH : EM) + " pins a note");
            setTimeout(closeModal, on ? 900 : 1600);
          })
          .catch(function (err) {
            go.disabled = false;
            say((err && err.message) || "that didn't work", true);
          });
      };
    }
    function openNoteModal(idx) {
      var n = NOTES[idx], s = resolveNoteStyle(n);
      var size = Math.round(Math.min(window.innerWidth * 0.82, 380));
      modal.innerHTML =
        '<div class="wm-stage">' +
          '<div class="wm-note-box" style="position:relative;width:' + size + 'px;height:' + size + 'px">' +
            noteInner(s, n.body, n.author, size) +
          "</div>" +
          '<div class="wm-tools">' +
            '<button class="wm-tool" data-act="close" title="close">✕</button>' +
            (PHONE ? "" : '<button class="wm-tool" data-act="move" title="move it">✥</button>') +
            '<button class="wm-tool" data-act="edit" title="edit">✎</button>' +
            '<button class="wm-tool" data-act="delete" title="remove">🗑</button>' +
          '</div>' +
        '</div>';
      modal.classList.add("open");
      modal.onclick = function (e) {
        var t = e.target.closest(".wm-tool");
        if (t) {
          var a = t.getAttribute("data-act");
          if (a === "close") closeModal();
          else if (a === "move") { closeModal(); unlockNote(idx); }
          else if (a === "edit") { closeModal(); editNote(idx); }
          else if (a === "delete") { closeModal(); deleteNote(idx); }
          return;
        }
        if (e.target === modal) closeModal(); // tap backdrop to close
      };
    }
    function deleteNote(idx) {
      var n = NOTES[idx], w = WALL_NOTES.indexOf(n);
      if (w >= 0) WALL_NOTES.splice(w, 1);
      deleteNoteDb(n);            // remove from Supabase (no-op if it had no id yet)
      renderWall();
    }
    function editNote(idx) {
      var n = NOTES[idx], s = resolveNoteStyle(n);
      editingNote = n;
      addDraft = { body: n.body, author: n.author, color: s.color, inkColor: s.inkColor >= 0 ? s.inkColor : 0, paper: s.paper, edge: s.curved ? "curved" : "sharp", folded: s.folded, doodle: s.doodle, fasten: s.fasten, pin: s.pin, pinColor: s.pinColor, tape: s.tape, tapePat: s.tapePat, tilt: s.tilt, size: s.size, strokes: (n.strokes || []).map(function (st) { return { color: st.color, w: st.w, pts: st.pts.slice() }; }) };
      showAdd();
    }

    // make note `idx` the single movable one (locks all the others)
    var placeBtn = document.getElementById("wallPlace");
    placeBtn.addEventListener("click", relockAll);
    function unlockNote(idx) {
      for (var k = 0; k < NOTES.length; k++) NOTES[k].locked = k !== idx;
      var els = wallNotes.querySelectorAll(".wnote");
      for (var j = 0; j < els.length; j++) els[j].classList.toggle("movable", +els[j].getAttribute("data-i") === idx);
      placeBtn.classList.add("show");
    }
    // lock everything again (confirm placement, or clicking off the movable note)
    function relockAll() {
      for (var k = 0; k < NOTES.length; k++) NOTES[k].locked = true;
      var els = wallNotes.querySelectorAll(".wnote.movable");
      for (var j = 0; j < els.length; j++) els[j].classList.remove("movable");
      placeBtn.classList.remove("show");
    }
    if (NOTES.some(function (n) { return n.locked === false; })) placeBtn.classList.add("show"); // a just-added note is already movable

    var drag = null;
    wallNotes.addEventListener("pointerdown", function (e) {
      var el = e.target.closest(".wnote");
      if (!el) { relockAll(); return; }              // clicked empty board → lock the movable note
      var idx = +el.getAttribute("data-i");
      if (NOTES[idx].locked !== false) relockAll();  // clicked a different (locked) note → lock the movable one
      drag = { el: el, idx: idx, sx: e.clientX, sy: e.clientY, ol: parseFloat(el.style.left), ot: parseFloat(el.style.top), w: el.offsetWidth, moved: false, movable: NOTES[idx].locked === false };
      el.setPointerCapture(e.pointerId);
      if (drag.movable) { el.style.zIndex = 999; el.style.animation = "none"; el.style.cursor = "grabbing"; }
    });
    wallNotes.addEventListener("pointermove", function (e) {
      if (!drag) return;
      var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
      if (Math.abs(dx) + Math.abs(dy) > 5) drag.moved = true;
      if (!drag.movable || !drag.moved) return;
      var maxTop = wallNotes.clientHeight - drag.el.offsetHeight;
      drag.el.style.left = Math.max(0, Math.min(bw - drag.w, drag.ol + dx)) + "px";
      drag.el.style.top = Math.max(0, Math.min(maxTop, drag.ot + dy)) + "px";
    });
    function endDrag() {
      if (!drag) return;
      var d = drag; drag = null;
      if (d.movable) {
        d.el.style.cursor = ""; d.el.style.zIndex = 10 + d.idx;
        if (d.moved) {
          var left = parseFloat(d.el.style.left), top = parseFloat(d.el.style.top);
          NOTES[d.idx].x = (left + d.w / 2) / bw * 100;   // % of board width
          NOTES[d.idx].y = top / bh * 100;                 // % of board height
          patchNote(NOTES[d.idx], { x: NOTES[d.idx].x, y: NOTES[d.idx].y }); // persist the move
        } else {
          openNoteModal(d.idx);                            // tapped the movable note → just read it
        }
      } else if (!d.moved) {
        openNoteModal(d.idx);                              // tap a locked note → open it (use the move ✥ tool to unlock)
      }
    }
    wallNotes.addEventListener("pointerup", endDrag);
    wallNotes.addEventListener("pointercancel", endDrag);
  }

  // ---------- the "add a note" creator (its own screen) ----------
  var addDraft = { body: "", author: EM, color: 1, inkColor: 0, paper: "plain", edge: "curved", folded: false, doodle: "♡", fasten: "tape", pin: "heart", pinColor: 0, tape: 0, tapePat: "stripe", tilt: -2, size: "l", strokes: [] };
  var drawStrokes = [], drawColor = "#c0567e", drawW = 2;
  var DRAW_COLORS = ["#c0567e", "#e8577b", "#5b8de8", "#5bb56a", "#e8a83a", "#7c5566", "#3a3a44", "#ffffff"];
  var DRAW_SIZES = [{ label: "fine", w: 1.1 }, { label: "medium", w: 2 }, { label: "bold", w: 3.4 }];
  var editingNote = null; // set when the creator is editing an existing note

  function showAdd() {
    rootSkin("rt-board");
    clearBloomTimers();
    successEl.classList.remove("show");
    bloomEl.classList.remove("show"); bloomEl.innerHTML = "";
    wallEl.classList.remove("show"); wallEl.innerHTML = ""; addEl.classList.remove("show"); addEl.innerHTML = ""; drawEl.classList.remove("show"); drawEl.innerHTML = ""; homeEl.classList.remove("show"); homeEl.innerHTML = ""; homeActive = false;
    siteEl.classList.remove("show");
    lockEl.style.display = "none";
    backdropEl.style.display = "none";
    renderAdd();
    addEl.classList.add("show");
    // Only now can anything be measured: the miniature's scale and its show/hide test both need real
    // rects, and renderAdd() ran while this screen was still display:none.
    showMini();
    document.body.style.overflow = "auto";
    markDebug("add");
  }

  /* ---------- the customisation grid ----------
     One two-column grid (label · choices) instead of a stack of label-above-choices blocks: that alone
     removes a whole line per setting. Choices are shown as the thing they DO wherever possible — paper
     patterns are real paper, edges are real corners, pins are the pin — which is both smaller than a word
     and easier to read at a glance. It re-renders wholesale on every change, which keeps three things that
     used to be hand-synced honest: the selected ring, which sub-row is showing, and the paper chips (they
     are drawn in the note's CURRENT colour, so they have to follow the colour picker). */
  function custHTML() {
    function swatches(g, list, style) {
      return list.map(function (c, ix) {
        var sel = +addDraft[g] === ix ? " sel" : "";
        return '<span class="opt-swatch' + sel + '" data-g="' + g + '" data-v="' + ix + '" style="' + style(c) + '"></span>';
      }).join("");
    }
    function chips(g, items) {
      return items.map(function (it) {
        var sel = String(addDraft[g]) === String(it.v) ? " sel" : "";
        return '<button class="opt' + sel + '" data-g="' + g + '" data-v="' + it.v + '"' +
          (it.title ? ' title="' + it.title + '"' : "") + ">" + it.label + "</button>";
      }).join("");
    }
    // `dim` marks the fastening that isn't in use — still fully tappable, just visibly not the current one
    function cell(label, inner, dim) {
      dim = dim || "";
      return '<div class="cl' + dim + '">' + label + "</div>" +
             '<div class="cv' + dim + '">' + inner + "</div>";
    }

    // paper: each chip is the actual paper, in the note's current colour
    var paper = ["plain", "lined", "check", "hearts"].map(function (p) {
      var sel = addDraft.paper === p ? " sel" : "";
      return '<span class="opt-swatch' + sel + '" data-g="paper" data-v="' + p + '" title="' + p + '" style="' +
        "background-image:" + noteCardBg({ color: addDraft.color, paper: p }) + '"></span>';
    }).join("");
    // edge: a real corner rather than the words "curved"/"sharp"
    var edge = ["curved", "sharp"].map(function (e) {
      var sel = addDraft.edge === e ? " sel" : "";
      return '<span class="opt-swatch corner-chip' + sel + '" data-g="edge" data-v="' + e + '" title="' + e + '" style="' +
        "background-image:" + WPADS[addDraft.color].bg + ";border-radius:" + (e === "curved" ? "11px" : "2px") + '"></span>';
    }).join("");

    // Each group is one no-wrap flex box, so when a row is too narrow it breaks BETWEEN groups — the pin
    // shapes never end up split across two lines with their colours.
    function grp(inner) { return '<span class="cgrp">' + inner + "</span>"; }
    // No "held by pin / tape" toggle any more: picking a pin IS choosing a pin, and picking tape is
    // choosing tape. One fewer control, one fewer row, one fewer tap — and the two rows say which is in
    // use by dimming the one that isn't, which the old toggle needed a whole extra row to express.
    function grp(inner) { return '<span class="cgrp">' + inner + "</span>"; }
    var pinRow =
      grp(chips("pin", [{ v: "heart", label: "♥" }, { v: "star", label: "★" }, { v: "circle", label: "●" }, { v: "flower", label: "❀" }])) +
      '<span class="cgap"></span>' +
      grp(swatches("pinColor", WPIN_HUES, function (c) { return "background:" + c; }));
    var tapeRow =
      grp(swatches("tape", WTAPE_HUES, function (c) { return "background:" + c; })) +
      '<span class="cgap"></span>' +
      grp(["stripe", "plain", "check"].map(function (p) {
        // real tape in the chosen colour rather than the glyphs ▨▬▦ — those were three different shapes
        // and weights (the solid one especially), so the row never looked like one set of choices.
        var sel = addDraft.tapePat === p ? " sel" : "";
        return '<span class="opt-swatch' + sel + '" data-g="tapePat" data-v="' + p + '" title="' + p + '" style="' +
          "background:" + tapeBg(addDraft.tape, p) + '"></span>';
      }).join(""));

    return '<div class="cust">' +
      cell("paper", grp(paper) + '<span class="cgap"></span>' + grp(edge)) +
      cell("colour", swatches("color", WPADS, function (p) { return "background-image:" + p.bg; })) +
      cell("ink", swatches("inkColor", WINK, function (c) { return "background:" + c; })) +
      cell("doodle", chips("doodle", WDOODLE_CHOICES.map(function (d) { return { v: d, label: d }; }))) +
      cell("pin", pinRow, addDraft.fasten === "pin" ? "" : " dim") +
      cell("tape", tapeRow, addDraft.fasten === "tape" ? "" : " dim") +
      cell("from", grp(chips("author", [{ v: EM, label: "em yêu" }, { v: ANH, label: "anh yêu" }])) +
        '<span class="cgap"></span>' +
        grp(chips("size", [{ v: "s", label: "small", title: "small on the board" }, { v: "l", label: "large", title: "large on the board" }]))) +
    "</div>";
  }

  function renderAdd() {
    addEl.innerHTML =
      '<div class="add-inner">' +
        '<button class="add-back" id="addCancel" title="back">←</button>' +
        '<div class="add-title">✎ leave a note</div>' +
        // Text and drawing are left exactly as they were on purpose — they become their own expanding
        // sections next. The words live here now rather than inside the (removed) big note preview.
        '<textarea class="add-msg" id="addBody" placeholder="leave a note" spellcheck="false"></textarea>' +
        '<button class="draw-open" id="drawOpen">✎ ' + (addDraft.strokes && addDraft.strokes.length ? "edit drawing" : "add a drawing") + "</button>" +
        '<div id="custHost">' + custHTML() + "</div>" +
        '<div class="add-actions"><button class="add-btn primary" id="addSave">pin it to the wall 💗</button></div>' +
      "</div>" +
      // pinned miniature — deliberately OUTSIDE .add-inner (see the .add-mini comment in the stylesheet)
      '<div class="add-mini" id="addMini" title="your note">' +
        '<span class="am-tape"></span>' +
        '<div class="am-window"><div class="am-shrink" id="addMiniInner"></div></div>' +
        '<span class="am-cap">your note</span>' +
      "</div>";

    if (!renderAdd._bound) {
      renderAdd._bound = true;
      addEl.addEventListener("click", function (e) {
        var o = e.target.closest("[data-g]");
        if (!o) return;
        var g = o.getAttribute("data-g"), v = o.getAttribute("data-v");
        if (g === "color" || g === "pinColor" || g === "tape" || g === "inkColor") addDraft[g] = +v;
        else if (g === "folded") addDraft.folded = v === "folded";
        else addDraft[g] = v;
        // choosing from either fastening row selects that fastening — see the note in custHTML()
        if (g === "pin" || g === "pinColor") addDraft.fasten = "pin";
        if (g === "tape" || g === "tapePat") addDraft.fasten = "tape";
        var host = document.getElementById("custHost");
        if (host) host.innerHTML = custHTML();   // redraw the lot: nothing left to keep in sync by hand
        styleWriteField();                       // ink/paper/colour changes show in the field too
        renderMini();
      });
    }
    var body = document.getElementById("addBody");
    body.value = addDraft.body || "";
    body.addEventListener("input", function () {
      addDraft.body = body.value;
      // at most one miniature redraw a frame — a note per keystroke is wasted work
      if (renderAdd._pend) return;
      renderAdd._pend = true;
      requestAnimationFrame(function () { renderAdd._pend = false; renderMini(); });
    });
    document.getElementById("addCancel").addEventListener("click", showWall);
    document.getElementById("addSave").addEventListener("click", submitNote);
    document.getElementById("drawOpen").addEventListener("click", showDraw);
  }

  // The miniature is the SAME note markup as the big preview, rendered at a fixed 300px and scaled down to
  // fit its window — so whatever the real note does (paper, tape, doodle, drawing) it does here too, and
  // there is no second rendering path that could disagree with the first.
  var MINI_BASE = 300;
  function renderMini() {
    var inner = document.getElementById("addMiniInner");
    if (!inner) return;
    // Zero while .add is still display:none — renderAdd() runs BEFORE the screen is shown. Rendering at a
    // guessed width there produced a miniature scaled to the wrong size (and the phone media query narrows
    // this window, so the guess was wrong by 15%). showAdd() calls again once the screen is up.
    var win = inner.parentNode.clientWidth;
    if (!win) return;
    inner.innerHTML = noteInner(resolveNoteStyle(addDraft), addDraft.body, addDraft.author, MINI_BASE);
    // No tilt here: the whole card is already tilted by CSS, and rotating inside a clipped window would
    // slice the note's corners off.
    inner.style.transform = "scale(" + (win / MINI_BASE) + ")";
  }
  // Bound once on the persistent .add element — renderAdd() replaces its innerHTML on every open, so the
  // handler looks its elements up each time it runs rather than closing over ones that get thrown away.
  /* The writing field IS the note's paper: same background, same ink, same handwriting, and the same line
     breaks. That last part is the useful bit and it falls out of one ratio — a note's text box is
     (210 - 2x12) wide with 14px type at k=1, so it is ALWAYS 13.29 times its own font-size wide, whatever
     size the note gets drawn at. Give the field that same width-to-type ratio and every line wraps in
     exactly the same place as it will on the note. On a phone that works out around 14px of type, which is
     larger than the notes on the board actually are. */
  var NOTE_TEXT_EMS = (210 - 24) / 14;
  var WRITE_FS_MAX = 20;              // a comfortable ceiling — on a wide screen the ratio would give 60px
  function styleWriteField() {
    var ta = document.getElementById("addBody");
    if (!ta) return;
    var cs = getComputedStyle(ta);
    var padL = parseFloat(cs.paddingLeft), padR = parseFloat(cs.paddingRight);
    var bw = parseFloat(cs.borderLeftWidth) + parseFloat(cs.borderRightWidth);
    // Measure the CONTAINER, never the field itself: this sets the field's own width below, and reading
    // that back would shrink it a little further on every call.
    var par = ta.parentNode, pcs = getComputedStyle(par);
    var room = par.clientWidth - parseFloat(pcs.paddingLeft) - parseFloat(pcs.paddingRight) - padL - padR - bw;
    if (!(room > 0)) return;                      // hidden screen: nothing measurable yet
    var st = resolveNoteStyle(addDraft);
    // Type size is capped, and then the FIELD is narrowed to keep the ratio exact — the wrapping is the
    // thing being preserved, so when the two fight, the width gives way rather than the ratio.
    var fs = Math.min(WRITE_FS_MAX, room / NOTE_TEXT_EMS);
    var textW = fs * NOTE_TEXT_EMS;
    ta.style.width = (textW + padL + padR + bw).toFixed(1) + "px";   // box-sizing is border-box
    ta.style.fontFamily = WFONT;
    ta.style.fontSize = fs.toFixed(2) + "px";
    ta.style.lineHeight = (fs * 18 / 14).toFixed(2) + "px";   // 18/14 is the note's own line-height ratio
    ta.style.color = st.inkColor >= 0 ? WINK[st.inkColor] : WPADS[st.color].ink;
    ta.style.backgroundImage = noteCardBg(st);
  }

  // With the big preview gone the miniature IS the preview, so it is simply always on. (It used to appear
  // only once the big note scrolled away, which is why it had a scroll listener and a visibility test.)
  function showMini() {
    var mini = document.getElementById("addMini");
    if (mini) mini.classList.add("show");
    styleWriteField();
    renderMini();
  }
  window.addEventListener("resize", function () {
    // the breakpoint changes the miniature's window and the field's width, so both have to be recomputed
    if (!addEl.classList.contains("show")) return;
    styleWriteField();
    renderMini();
  });

  function submitNote() {
    var body = (addDraft.body || "").trim();
    if (!body) { var t = document.getElementById("addBody"); if (t) t.focus(); return; }
    if (editingNote) {
      // update the existing note in place (keeps its position on the board)
      var n = editingNote;
      n.body = body; n.author = addDraft.author; n.color = addDraft.color; n.inkColor = addDraft.inkColor;
      n.paper = addDraft.paper; n.edge = addDraft.edge; n.folded = addDraft.folded; n.doodle = addDraft.doodle;
      n.fasten = addDraft.fasten; n.pin = addDraft.pin; n.pinColor = addDraft.pinColor;
      n.tape = addDraft.tape; n.tapePat = addDraft.tapePat; n.tilt = addDraft.tilt; n.size = addDraft.size; n.strokes = addDraft.strokes;
      var row = noteObjToRow(n);
      patchNote(n, { body: row.body, author: row.author, style: row.style }); // persist the edit
    } else {
      WALL_NOTES.forEach(function (n) { n.locked = true; });   // lock everything…
      var note = {
        body: body, author: addDraft.author, color: addDraft.color, inkColor: addDraft.inkColor,
        paper: addDraft.paper, edge: addDraft.edge, folded: addDraft.folded, doodle: addDraft.doodle,
        fasten: addDraft.fasten, pin: addDraft.pin, pinColor: addDraft.pinColor, tape: addDraft.tape,
        tapePat: addDraft.tapePat, tilt: addDraft.tilt, size: addDraft.size, strokes: addDraft.strokes, locked: false,
        x: 50, y: 10    // % of board — lands centre-top; drag it anywhere, which saves the spot
      };
      WALL_NOTES.push(note);   // …the new one is the single movable note
      saveNewNote(note);       // persist to Supabase + backfill its id
    }
    addDraft.body = "";
    addDraft.strokes = [];   // clear the drawing so it doesn't carry into the next note
    showWall();
  }

  // ---------- the drawing screen ----------
  function showDraw() {
    rootSkin("rt-board");
    clearBloomTimers();
    successEl.classList.remove("show");
    bloomEl.classList.remove("show"); bloomEl.innerHTML = "";
    wallEl.classList.remove("show"); wallEl.innerHTML = "";
    addEl.classList.remove("show"); addEl.innerHTML = ""; drawEl.classList.remove("show"); drawEl.innerHTML = ""; homeEl.classList.remove("show"); homeEl.innerHTML = ""; homeActive = false;
    siteEl.classList.remove("show");
    lockEl.style.display = "none";
    backdropEl.style.display = "none";
    renderDraw();
    drawEl.classList.add("show");
    document.body.style.overflow = "auto";
    markDebug("draw");
  }

  function renderDraw() {
    var s = resolveNoteStyle(addDraft);
    var sBg = {}; for (var kk in s) sBg[kk] = s[kk]; sBg.strokes = []; // note look, minus the drawing (canvas handles that)
    var size = Math.min(340, window.innerWidth - 56); // identical to the creator preview, so the note never rescales when toggling draw mode
    drawStrokes = (addDraft.strokes || []).map(function (st) { return { color: st.color, w: st.w, pts: st.pts.slice() }; });

    function sw(list, key, val) { return list.map(function (o) { var v = key === "color" ? o : o.w; var sel = v === val ? " sel" : ""; if (key === "color") return '<span class="opt-swatch' + sel + '" data-dc="' + o + '" style="background:' + o + '"></span>'; return '<button class="opt' + sel + '" data-dw="' + o.w + '">' + o.label + "</button>"; }).join(""); }

    drawEl.innerHTML =
      '<div class="add-inner">' +
        '<button class="add-back" id="drawBack" title="back">←</button>' +
        '<div class="add-title">✎ doodle on it</div>' +
        '<div class="draw-stage">' +
          '<div class="draw-card" style="position:relative;width:' + size + 'px;height:' + size + 'px">' +
            noteInner(sBg, addDraft.body, addDraft.author, size) +
            '<canvas id="drawCanvas" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;z-index:6;border-radius:' + (s.curved ? "16px" : "3px") + '"></canvas>' +
          "</div>" +
        "</div>" +
        '<div class="draw-tools">' +
          '<div class="add-label">pen colour</div>' +
          '<div class="add-opts" id="drawCols">' + sw(DRAW_COLORS, "color", drawColor) + '<input type="color" id="drawHex" class="draw-hex" value="' + drawColor + '" title="custom colour"></div>' +
          '<div class="add-label">brush size</div>' +
          '<div class="draw-size-row"><input type="range" id="drawRange" min="0.6" max="6.5" step="0.1" value="' + drawW + '"><span class="draw-size-dot" id="drawDot"></span></div>' +
          '<div class="add-opts" style="margin-top:14px">' +
            '<button class="add-btn ghost" id="drawUndo">↶ undo</button>' +
            '<button class="add-btn ghost" id="drawClear">clear</button>' +
            '<button class="add-btn primary" id="drawDone">done ✓</button>' +
          "</div>" +
        "</div>" +
      "</div>";

    var canvas = document.getElementById("drawCanvas");
    var ctx = canvas.getContext("2d");
    var dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr; canvas.height = size * dpr; ctx.scale(dpr, dpr);
    function paintStroke(st) {
      if (!st.pts.length) return;
      ctx.strokeStyle = st.color; ctx.lineWidth = st.w / 100 * size; ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.beginPath(); ctx.moveTo(st.pts[0][0] * size, st.pts[0][1] * size);
      for (var i = 1; i < st.pts.length; i++) ctx.lineTo(st.pts[i][0] * size, st.pts[i][1] * size);
      if (st.pts.length === 1) ctx.lineTo(st.pts[0][0] * size + 0.1, st.pts[0][1] * size + 0.1);
      ctx.stroke();
    }
    function redraw() { ctx.clearRect(0, 0, size, size); drawStrokes.forEach(paintStroke); }
    redraw();

    var cur = null;
    function at(e) { var r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; }
    canvas.addEventListener("pointerdown", function (e) { canvas.setPointerCapture(e.pointerId); cur = { color: drawColor, w: drawW, pts: [at(e)] }; });
    canvas.addEventListener("pointermove", function (e) { if (!cur) return; cur.pts.push(at(e)); redraw(); paintStroke(cur); });
    function endStroke() { if (cur) { if (cur.pts.length) drawStrokes.push(cur); cur = null; } }
    canvas.addEventListener("pointerup", endStroke);
    canvas.addEventListener("pointercancel", endStroke);

    function setSel(container, el) { var xs = container.children; for (var i = 0; i < xs.length; i++) xs[i].classList.remove("sel"); if (el) el.classList.add("sel"); }
    var hex = document.getElementById("drawHex"), dot = document.getElementById("drawDot");
    function updateDot() { var px = Math.max(4, Math.round(drawW * 2.8)); dot.style.width = px + "px"; dot.style.height = px + "px"; dot.style.background = drawColor; }
    updateDot();
    document.getElementById("drawCols").addEventListener("click", function (e) { var c = e.target.closest("[data-dc]"); if (c) { drawColor = c.getAttribute("data-dc"); setSel(this, c); hex.value = drawColor; updateDot(); } });
    hex.addEventListener("input", function () { drawColor = this.value; setSel(document.getElementById("drawCols"), null); updateDot(); });
    document.getElementById("drawRange").addEventListener("input", function () { drawW = +this.value; updateDot(); });
    document.getElementById("drawUndo").onclick = function () { drawStrokes.pop(); redraw(); };
    document.getElementById("drawClear").onclick = function () { drawStrokes = []; redraw(); };
    document.getElementById("drawDone").onclick = function () { addDraft.strokes = drawStrokes.map(function (st) { return { color: st.color, w: st.w, pts: st.pts }; }); showAdd(); };
    document.getElementById("drawBack").onclick = function () { showAdd(); };
  }

  // ---------- home (site) that transitions onto the board on a small scroll/swipe ----------
  var homeActive = false, navState = "home", navBusy = false;

  function showHome() {
    rootSkin("rt-warm");
    clearBloomTimers();
    successEl.classList.remove("show");
    bloomEl.classList.remove("show"); bloomEl.innerHTML = "";
    wallEl.classList.remove("show"); wallEl.innerHTML = ""; addEl.classList.remove("show"); addEl.innerHTML = ""; drawEl.classList.remove("show"); drawEl.innerHTML = "";
    siteEl.classList.remove("show");
    lockEl.style.display = "none";
    backdropEl.style.display = "none";
    renderHome();
    homeEl.style.transition = ""; homeEl.style.transform = "";
    homeEl.classList.add("show");
    document.body.style.overflow = "hidden";
    navState = "home"; navBusy = false; homeActive = true;
    markDebug("home");
  }

  function renderHome() {
    // the site (hero + letter) is the resting state; a tiny scroll transitions to the board
    var heroEl = siteEl.querySelector(".hero"), letterEl = siteEl.querySelector(".letter");
    var topHTML = (heroEl ? heroEl.outerHTML : "<section class='hero'><h1>Welcome, my love</h1></section>") + (letterEl ? letterEl.outerHTML : "");
    homeEl.innerHTML = '<div class="site home-site">' + topHTML + "</div>";
  }

  // a small scroll/swipe just TRIGGERS a full self-playing slide between site and board
  // A single "reveal amount" v (0 = home fully shown, 1 = fully dissolved/board shown) drives both:
  //   • the mask position — the soft transparent band sweeps from the bottom up the screen;
  //   • the content translate — the page swipes up like a real scroll.
  // vFrom/vTo let us play it forward (0→1, to board) or backward (1→0, back home).
  var navRaf = 0; // id of the in-flight transition frame, so we never stack two loops
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function animMask(vFrom, vTo, done) {
    var t0 = null, dur = 760;
    var inner = homeEl.querySelector(".home-site") || homeEl;
    function apply(v) {
      // slide the 250vh mask up: at v=0 the opaque plateau (0-45% = 0-112vh) fully covers the
      // 100vh viewport (solid, no peek); as v→1 the smoothstep fade sweeps in from the bottom and
      // up until fully dissolved (y=-250vh puts the viewport past the transparent end).
      var y = (-250 * v).toFixed(1) + "vh";
      homeEl.style.webkitMaskPosition = "0 " + y;
      homeEl.style.maskPosition = "0 " + y;
      inner.style.transform = "translate3d(0," + (-110 * v).toFixed(2) + "vh,0)"; // swipe up
    }
    function finish() {
      inner.style.transform = "";
      homeEl.style.webkitMaskImage = ""; homeEl.style.maskImage = "";
      homeEl.style.webkitMaskPosition = ""; homeEl.style.maskPosition = "";
      if (done) done();
    }
    if (navRaf) { cancelAnimationFrame(navRaf); navRaf = 0; } // never run two at once
    if (reduceMotion) { apply(vTo); finish(); return; }        // no motion → snap to end state
    apply(vFrom);
    function step(ts) {
      if (t0 == null) t0 = ts;
      var p = Math.min(1, (ts - t0) / dur);
      var e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; // ease-in-out
      apply(vFrom + (vTo - vFrom) * e);
      if (p < 1) { navRaf = requestAnimationFrame(step); }
      else { navRaf = 0; finish(); }
    }
    navRaf = requestAnimationFrame(step);
  }
  function navToBoard() {
    if (navBusy || navState !== "home") return;
    navBusy = true; navState = "animating";
    backdropEl.style.display = "";                 // board's living backdrop
    wallEl.classList.add("show");                  // show FIRST so the board has real dimensions...
    void wallEl.offsetWidth;                        // ...force layout...
    renderWall();                                   // ...then render, so notes size/place exactly like the Wall tab
    homeEl.classList.add("revealing");
    animMask(0, 1, function () {  // transparent band sweeps bottom→up + content swipes up, revealing board
      homeEl.classList.remove("show", "revealing");
      navState = "board"; navBusy = false;
    });
  }
  function navToHome() {
    if (navBusy || navState !== "board") return;
    navBusy = true; navState = "animating";
    homeEl.classList.add("show", "revealing");
    animMask(1, 0, function () {  // band recedes back down + content swipes down as the site fills in
      wallEl.classList.remove("show"); wallEl.innerHTML = "";
      backdropEl.style.display = "none"; // home is flat cream, no living backdrop
      homeEl.classList.remove("revealing");
      navState = "home"; navBusy = false;
    });
  }

  window.addEventListener("wheel", function (e) {
    if (!homeActive) return;
    if (navState === "home" && e.deltaY > 6) { e.preventDefault(); navToBoard(); }
    else if (navState === "board" && e.deltaY < -6) { e.preventDefault(); navToHome(); }
  }, { passive: false });
  var navTouchY = null;
  window.addEventListener("touchstart", function (e) { if (homeActive) navTouchY = e.touches[0].clientY; }, { passive: true });
  window.addEventListener("touchmove", function (e) {
    if (!homeActive || navTouchY == null) return;
    var dy = navTouchY - e.touches[0].clientY; // >0 = swipe up
    if (navState === "home" && dy > 34) { navTouchY = null; navToBoard(); }
    else if (navState === "board" && dy < -34 && !e.target.closest(".wnote")) { navTouchY = null; navToHome(); }
  }, { passive: true });

  // ---------- notes board (Supabase) ----------
  // In the published build these two are blanked and get filled by
  // decryptPayload() on a correct unlock (build.js handles that).
  var SUPABASE_URL = "";
  var SUPABASE_KEY = "";
  var NOTE_COLORS = ["#fff59d", "#ffd1dc", "#bfe0ff", "#c8f0c8", "#ffe0b3", "#e6d4ff"]; // sticky-note pastels
  var PIN_COLORS = ["#d63b3b", "#3b74d6", "#e0a021", "#3bb06a", "#c33bd6"];             // pushpins
  var notesInited = false;

  function notesEndpoint() { return SUPABASE_URL + "/rest/v1/notes"; }
  function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
  function fmtDate(iso) {
    try { return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); }
    catch (e) { return ""; }
  }

  function renderNotes(list) {
    var grid = document.getElementById("notesGrid");
    var statusEl = document.getElementById("notesStatus");
    if (!grid) return;
    grid.innerHTML = "";
    if (!list || !list.length) {
      if (statusEl) { statusEl.style.display = ""; statusEl.textContent = "no notes yet — be the first to leave one 💕"; }
      return;
    }
    if (statusEl) statusEl.style.display = "none";
    list.forEach(function (n, i) {
      var el = document.createElement("div");
      el.className = "note";
      el.style.background = n.color || NOTE_COLORS[i % NOTE_COLORS.length];
      el.style.setProperty("--tilt", (((i * 53) % 9) - 4) + "deg");   // stable per-note lean, -4..4°
      el.style.setProperty("--pin", PIN_COLORS[i % PIN_COLORS.length]);
      var who = n.author ? '<span class="who">' + esc(n.author) + "</span>" : '<span class="who">&nbsp;</span>';
      el.innerHTML = '<div class="body">' + esc(n.body) + "</div>" +
                     '<div class="meta">' + who + "<span>" + fmtDate(n.created_at) + "</span></div>";
      grid.appendChild(el);
    });
  }

  function loadNotes() {
    var grid = document.getElementById("notesGrid");
    var statusEl = document.getElementById("notesStatus");
    if (!grid) return;
    if (statusEl) { statusEl.style.display = ""; statusEl.textContent = "loading our notes…"; }
    fetch(notesEndpoint() + "?select=*&order=created_at.desc", {
      headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY }
    })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(renderNotes)
      .catch(function (e) {
        if (statusEl) { statusEl.style.display = ""; statusEl.textContent = "couldn't load our notes right now 😢"; }
        console.error("[notes] load failed", e);
      });
  }

  // attach the "pin a note" handler once the board is in the DOM (dev: at load; prod: after unlock)
  function initNotes() {
    if (notesInited) return;
    var form = document.getElementById("noteForm");
    if (!form) return;
    notesInited = true;
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var bodyEl = document.getElementById("noteBody");
      var authorEl = document.getElementById("noteAuthor");
      var body = bodyEl.value.trim();
      if (!body) return;
      var author = authorEl.value.trim();
      var color = NOTE_COLORS[Math.floor(Math.random() * NOTE_COLORS.length)];
      var btn = form.querySelector("button");
      btn.disabled = true;
      fetch(notesEndpoint(), {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json", Prefer: "return=representation"
        },
        body: JSON.stringify({ body: body, author: author || null, color: color })
      })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function () { bodyEl.value = ""; loadNotes(); })
        .catch(function (e) { console.error("[notes] post failed", e); alert("Couldn't pin that note — try again in a sec 💗"); })
        .then(function () { btn.disabled = false; });
    });
  }

  // a pretty layered cherry-blossom, drawn in SVG.
  // Each layer is its own stacked SVG so it can bloom in on its own delay.
  function renderBloom() {
    // one petal, pointing up, base at the center (100,100), notched tip at the top
    var petal = "M100 100 C70 92 58 56 78 30 C83 22 91 22 100 35 C109 22 117 22 122 30 C142 56 130 92 100 100 Z";

    var N = 9; // 💐 nine layers — one for each month together

    // blend two hex colors, t = 0 (a) → 1 (b)
    function hx(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
    function mix(a, b, t) {
      var A = hx(a), B = hx(b);
      return "#" + [0, 1, 2].map(function (k) {
        var v = Math.round(A[k] + (B[k] - A[k]) * t);
        return ("0" + v.toString(16)).slice(-2);
      }).join("");
    }

    // each layer's petal gradient is interpolated between a light (front)
    // and a deep (back) palette, so layer N is always a step darker than N-1.
    var stopDefs = [
      [0,   "#fffdfe", "#ffe6f0"],  // near-center: stays bright
      [0.5, "#ffe8f1", "#ff9dc0"],  // middle
      [1,   "#ffccde", "#df5d89"]   // tip: deepens the most
    ];
    function petalGrad(i, t, radius) {
      var stops = stopDefs.map(function (s) {
        return '<stop offset="' + s[0] + '" stop-color="' + mix(s[1], s[2], t) + '"/>';
      }).join("");
      return '<radialGradient id="petalFill' + i + '" cx="100" cy="100" r="' + radius +
             '" gradientUnits="userSpaceOnUse">' + stops + '</radialGradient>';
    }
    var CORE_GRAD =
      '<radialGradient id="coreFill" cx="100" cy="97" r="15" gradientUnits="userSpaceOnUse">' +
        '<stop offset="0" stop-color="#fff7d6"/>' +
        '<stop offset="0.6" stop-color="#ffe08c"/>' +
        '<stop offset="1" stop-color="#f4b64f"/>' +
      '</radialGradient>';

    function svgWrap(defsInner, inner) {
      return '<svg viewBox="0 0 200 200" width="180" height="180" xmlns="http://www.w3.org/2000/svg">' +
             '<defs>' + defsInner + '</defs>' + inner + '</svg>';
    }
    function petalsMarkup(count, fillId, stroke, scale, rot) {
      var p = "", step = 360 / count;
      for (var i = 0; i < count; i++) {
        p += '<path d="' + petal + '" fill="url(#' + fillId + ')" stroke="' + stroke + '" ' +
             'stroke-opacity="0.22" stroke-width="1" ' +
             'transform="rotate(' + (i * step + step / 2 + rot) + ' 100 100)"/>';
      }
      return '<g transform="translate(100 100) scale(' + scale + ') translate(-100 -100)">' + p + '</g>';
    }

    // stamens + golden centre
    var core = "";
    for (var s = 0; s < 10; s++) {
      var ang = (Math.PI * 2 / 10) * s, r = 17;
      var x = (100 + Math.cos(ang) * r).toFixed(1), y = (100 + Math.sin(ang) * r).toFixed(1);
      core += '<line x1="100" y1="100" x2="' + x + '" y2="' + y + '" stroke="#f6c14b" stroke-width="1.4"/>' +
              '<circle cx="' + x + '" cy="' + y + '" r="2.2" fill="#f4a63a"/>';
    }
    core += '<circle cx="100" cy="100" r="11" fill="url(#coreFill)"/>';

    var lightGrad = petalGrad(0, 0.32, 96);   // id petalFill0 — soft front petals
    var deepGrad  = petalGrad(1, 0.72, 122);  // id petalFill1 — deeper back petals (a tad darker)

    // a little white twinkle at the petal tip, flashing as the petal pops
    function spark(begin) {
      return '<g class="spk" style="animation-delay:' + begin.toFixed(2) + 's">' +
             '<path d="M100 13 L100 31 M91 22 L109 22" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>' +
             '<circle cx="100" cy="22" r="2" fill="#fff"/></g>';
    }
    // one petal at `angle`, optionally scaled, with its tip sparkle
    function petalUnit(angle, scale, fillId, stroke, begin) {
      var body = '<path d="' + petal + '" fill="url(#' + fillId + ')" stroke="' + stroke + '" ' +
                 'stroke-opacity="0.25" stroke-width="1"/>' + spark(begin);
      if (scale && scale !== 1) body = '<g transform="translate(100 100) scale(' + scale + ') translate(-100 -100)">' + body + '</g>';
      return '<g transform="rotate(' + angle + ' 100 100)">' + body + '</g>';
    }
    function petalDiv(gradDef, angle, scale, fillId, stroke, delay) {
      return '<div class="bloom-petal" style="animation-delay:' + delay.toFixed(2) + 's">' +
             svgWrap(gradDef, petalUnit(angle, scale, fillId, stroke, delay + 0.05)) + '</div>';
    }

    var STEP = 0.15;
    var OFF = 0.4; // petals wait for the centre to appear first

    // the golden centre appears first (the heart of the flower), then a 5-petal
    // blossom opens around it, then 4 more grow in behind (5 → 9) — one per month.
    var h = '<div class="blossom">';
    var backAngles = [36, 108, 180, 252];          // 4 back petals filling the gaps of the 5
    for (var b = 0; b < 4; b++)                     // DOM-first so they paint behind…
      h += petalDiv(deepGrad, backAngles[b], 1.28, "petalFill1", "#f97ba4", OFF + (5 + b) * STEP + 0.1); // …but appear after the 5
    for (var i = 0; i < 5; i++)
      h += petalDiv(lightGrad, i * 72, 1, "petalFill0", "#ff97bd", OFF + i * STEP);
    // centre first (delay 0), and last in the DOM so it stays on top
    h += '<div class="bloom-petal" style="animation-delay:0s">' + svgWrap(CORE_GRAD, core) + '</div>';
    h += '</div>';

    bloomEl.innerHTML = h;
  }

  // 🔧 DEBUG BAR — dev only, remove before sharing.
  var debugbar = document.getElementById("debugbar");
  function markDebug(name) {
    if (!debugbar) return;
    var btns = debugbar.querySelectorAll("button");
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle("active", btns[i].getAttribute("data-screen") === name);
    }
  }
  var centerguide = document.getElementById("centerguide");
  if (debugbar) {
    debugbar.addEventListener("click", function (e) {
      var t = e.target.closest("[data-toggle]");
      if (t && t.getAttribute("data-toggle") === "center") {
        var on = centerguide.classList.toggle("on");
        t.classList.toggle("active", on);
        return;
      }
      var b = e.target.closest("[data-screen]");
      if (!b) return;
      var s = b.getAttribute("data-screen");
      if (s === "lock") showLock();
      else if (s === "celebrate") showCelebration();
      else if (s === "bloom") showBloom();
      else if (s === "site") showSite();
      else if (s === "wall") { showWall(); loadWallNotes(); }
      else if (s === "add") showAdd();
      else if (s === "draw") showDraw();
      else if (s === "home") showHome();
    });
  }

  // 🎯 CENTRE GUIDE — deliberately NOT inside the DEV_ONLY block, because the things it helps line up
  // (the ears against the Dynamic Island, the curtain, the frame) only exist on a real phone, and the
  // debug bar that normally toggles it is stripped from the published file. Add #center to the URL:
  //   https://waffvil.github.io/mimaimo-wurong/#center
  // and a 1px crosshair is pinned through the middle of the screen. Drop the hash and relaunch to clear.
  // It reveals nothing and unlocks nothing — the passcode is still the only way in.
  if (/[?&#]center\b/.test(location.search + location.hash)) {
    var cg = document.getElementById("centerguide");
    if (!cg) {                                  // in the published build the markup is gone; make one
      cg = document.createElement("div");
      cg.id = "centerguide";
      cg.className = "centerguide";
      document.body.appendChild(cg);
    }
    cg.classList.add("on");
  }

  
})();

// ---------- PWA: register the service worker (only over http/https — no-ops on file://) ----------
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () { /* offline install is best-effort */ });
  });
}
</script>
</body>
