<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M ♡ V</title>
<!-- PWA: installable, fullscreen, instant-launch on iPhone (Safari → Share → Add to Home Screen) -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fffaf1">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="M + V">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  /* the base gradient lives on the canvas (<html>); the solid colour underneath matches the gradient's
     bottom so the iOS bottom safe-area (beyond the gradient box) blends instead of showing white */
  html { background: linear-gradient(160deg, #ffe6ee 0%, #fff2e6 46%, #ffe0ea 78%, #ffd9e6 100%) #ffd9e6; }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    color: #6f4a54;
    overflow: hidden;
    background: transparent; /* the canvas (<html>) carries the gradient now, so safe-areas blend seamlessly */
  }

  /* ---------- animations ---------- */
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    12%  { opacity: var(--peak, 0.5); }
    88%  { opacity: var(--peak, 0.5); }
    100% { transform: translateY(-112vh) rotate(220deg); opacity: 0; }
  }
  @keyframes shimmer {
    0%   { transform: translate(-6%, -4%) scale(1); }
    50%  { transform: translate(6%, 4%) scale(1.12); }
    100% { transform: translate(-6%, -4%) scale(1); }
  }
  @keyframes shakeX {
    0%,100% { transform: translateX(0); }
    15% { transform: translateX(-9px); }
    30% { transform: translateX(8px); }
    45% { transform: translateX(-6px); }
    60% { transform: translateX(5px); }
    75% { transform: translateX(-3px); }
    90% { transform: translateX(2px); }
  }
  @keyframes checkPulse {
    0%,100% { transform: scale(1.18); opacity: 1; }
    50% { transform: scale(0.9); opacity: 0.5; }
  }
  @keyframes rain {
    0%   { transform: translateY(-12vh) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: translateY(112vh) rotate(300deg); opacity: 0; }
  }
  @keyframes cardIn {
    0%   { transform: scale(0.6) translateY(20px); opacity: 0; }
    60%  { transform: scale(1.06) translateY(0); opacity: 1; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  @keyframes heartBeat {
    0%,100% { transform: scale(1); }
    30% { transform: scale(1.18); }
    45% { transform: scale(0.96); }
    60% { transform: scale(1.09); }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- bloom screen ---------- */
  @keyframes petalOpen {
    0%   { transform: rotate(var(--a)) translateY(0) scale(0); opacity: 0; }
    30%  { opacity: 1; }
    100% { transform: rotate(var(--a)) translateY(calc(-1 * var(--len))) scale(1); opacity: 1; }
  }
  @keyframes growSpin {
    0%   { transform: translate(-50%,-50%) scale(0.25) rotate(-25deg); }
    100% { transform: translate(-50%,-50%) scale(1.25) rotate(28deg); }
  }
  @keyframes coreIn {
    0%   { transform: translate(-50%,-50%) scale(0); opacity: 0; }
    60%  { transform: translate(-50%,-50%) scale(1.25); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
  }
  @keyframes flash {
    0%   { transform: translate(-50%,-50%) scale(0); opacity: 0.95; }
    100% { transform: translate(-50%,-50%) scale(6); opacity: 0; }
  }
  @keyframes blackIn { 0% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes hintIn {
    0%   { opacity: 0; letter-spacing: 2px; }
    100% { opacity: 0.85; letter-spacing: 6px; }
  }

  /* ---------- stage ---------- */
  .backdrop { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .stage {
    position: relative;
    min-height: 100dvh;
    width: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    background: transparent; /* the persistent .backdrop shows through */
  }
  .shimmer {
    position: absolute; inset: -20%;
    pointer-events: none; z-index: 0;
    background:
      radial-gradient(38% 42% at 24% 28%, rgba(255,182,205,0.55), transparent 70%),
      radial-gradient(40% 44% at 78% 72%, rgba(255,214,168,0.50), transparent 72%),
      radial-gradient(34% 38% at 62% 18%, rgba(255,196,222,0.42), transparent 70%);
    animation: shimmer 16s ease-in-out infinite;
  }
  .hearts { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  .hearts span { position: absolute; bottom: -6vh; will-change: transform, opacity; }

  .panel {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    width: 100%; max-width: 340px;
  }

  .mono {
    display: flex; align-items: center; justify-content: center;
    width: 100%; margin-bottom: 34px;
    font-size: 44px; /* reference size for the optical nudge below */
    transform: translateX(-0.22em); /* counter the cursive V's rightward ink overflow */
  }
  .mono .letter {
    font-family: "Snell Roundhand", "Segoe Script", "Brush Script MT", cursive;
    font-size: 44px; font-weight: 600; color: #d8698a; line-height: 1;
  }
  /* em-based margins scale with the monogram size (big lock vs small celebration) */
  .mono .h { font-size: 20px; color: #e58aa4; margin: 0 0.5em 0 0.8em; transform: translateY(-2px); }
  /* on unlock, the M and V draw together and the heart swells —
     0.75s ease-in-out to match the passcode "checking" pulse timing */
  .mono .letter, .mono .h { transition: transform 0.75s ease-in-out; }
  .mono.together > .letter:first-child { transform: translateX(1.28em); }
  .mono.together > .letter:last-child  { transform: translateX(-1.28em); }
  .mono.together .h { transform: translateY(-2px) scale(1.5); position: relative; z-index: 3; }


  .prompt {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic; font-size: 17px; letter-spacing: 0.2px;
    text-align: center; margin: 4px 0 26px; color: #935767;
    text-wrap: pretty;
  }

  .dots { display: flex; gap: 16px; margin-bottom: 40px; height: 22px; align-items: center; }
  .dots .dot {
    width: clamp(13px,3.6vw,16px); height: clamp(13px,3.6vw,16px);
    border-radius: 50%;
    border: 2px solid rgba(215,106,134,0.45);
    background: transparent;
    transform: scale(0.72);
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    display: inline-block;
  }
  .dots .dot.filled {
    border-color: #d76a86;
    background: radial-gradient(circle at 35% 30%, #ff9fb6, #d76a86);
    transform: scale(1.18);
    box-shadow: 0 3px 10px rgba(215,106,134,0.5);
  }
  .dots.checking .dot.filled { animation: checkPulse 0.75s ease-in-out infinite; }

  .pad {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: clamp(14px, 4.5vw, 20px); justify-items: center;
  }
  .key {
    width: clamp(62px,19vw,76px); height: clamp(62px,19vw,76px);
    border-radius: 50%; border: none;
    background: rgba(255,255,255,0.6);
    color: #8a5462;
    font-size: clamp(26px,7vw,31px); font-weight: 300;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(216,105,138,0.18), inset 0 1px 0 rgba(255,255,255,0.8);
    transition: transform 0.12s ease, background 0.15s ease;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    user-select: none;
  }
  .key:active { transform: scale(0.9); background: rgba(255,196,214,0.85); }
  .key.del {
    background: transparent; box-shadow: none; color: #c07d8e;
    font-size: clamp(22px,6vw,26px);
  }
  .key.del:active { background: rgba(255,196,214,0.55); }
  .spacer { width: clamp(62px,19vw,76px); height: clamp(62px,19vw,76px); }

  /* ---------- success ---------- */
  .success {
    position: fixed; inset: 0; z-index: 5;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px;
    background: linear-gradient(160deg, rgba(255,231,239,0.94), rgba(255,239,228,0.94));
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  .success.show { display: flex; animation: fadeIn 0.4s ease both; }
  .confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .confetti span { position: absolute; top: -8vh; }
  .success .card { position: relative; text-align: center; animation: cardIn 0.7s cubic-bezier(0.34,1.56,0.64,1) both; }
  .success .big { font-size: 64px; animation: heartBeat 1.4s ease-in-out infinite; margin-bottom: 10px; }
  .success .mono { font-size: 30px; } /* scales the translateX nudge to this size */
  .success .mono .letter { font-size: 30px; }
  .success .mono .h { font-size: 15px; }
  .success .msg { font-family: Georgia, serif; font-style: italic; font-size: 24px; color: #935767; margin: 0; }

  /* ---------- lock fade-out + revealed site ---------- */
  .stage { transition: opacity 0.9s ease; }
  .stage.dismiss { opacity: 0; pointer-events: none; }
  .panel { transition: opacity 0.6s ease; }
  .panel.fade { opacity: 0; }

  .site {
    display: none;
    min-height: 100dvh;
    width: 100%;
    background: linear-gradient(160deg, #fff6f2 0%, #fff8f0 100%);
  }
  .site.show { display: block; animation: fadeIn 0.9s ease both; }

  /* starter content inside the revealed site */
  .site .hero {
    min-height: 100dvh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 40px 24px; gap: 8px;
  }
  .site .hero-mono {
    display: flex; align-items: center; margin-bottom: 12px;
    font-size: 56px; transform: translateX(-0.22em); /* same optical nudge, scaled */
  }
  .site .hero-mono .letter {
    font-family: "Snell Roundhand", "Segoe Script", "Brush Script MT", cursive;
    font-size: 56px; font-weight: 600; color: #d8698a; line-height: 1;
  }
  .site .hero-mono .h { font-size: 26px; color: #e58aa4; margin: 0 0.5em 0 0.8em; transform: translateY(-2px); }
  .site .hero h1 {
    font-family: Georgia, "Times New Roman", serif; font-style: italic;
    font-weight: 500; font-size: clamp(28px, 8vw, 40px); color: #935767; margin: 0;
  }
  .site .hero p {
    font-family: Georgia, serif; font-size: clamp(15px, 4.5vw, 18px);
    color: #a06d7a; margin: 4px 0 0;
  }
  .site .scroll-hint {
    margin-top: 34px; font: 12px -apple-system, system-ui, sans-serif;
    letter-spacing: 2px; text-transform: uppercase; color: #c99; opacity: 0.8;
    animation: floatHint 2s ease-in-out infinite;
  }
  @keyframes floatHint { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }

  /* --- cute decorative symbol lines (her aesthetic ♡) --- */
  .site .deco {
    text-align: center; color: #d78bac; opacity: 0.9;
    font-size: 15px; letter-spacing: 1px; line-height: 1.6;
    margin: 14px 0; font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  .site .kao {
    text-align: center; color: #cf7ba0; font-size: 17px;
    margin: 6px 0; font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  .site .deco--soft { color: #e0a6c1; font-size: 14px; }

  /* --- the letter --- */
  .letter { max-width: 640px; margin: 0 auto; padding: 20px 22px; }
  .letter-card {
    background: linear-gradient(#fffdfb, #fff6f1);
    border: 1px solid rgba(216,105,138,0.10);
    border-radius: 22px; padding: 38px 32px 26px;
    box-shadow: 0 22px 60px rgba(216,105,138,0.14);
  }
  .letter-card h2 {
    font-family: "Snell Roundhand", "Segoe Script", "Brush Script MT", cursive;
    font-weight: 600; color: #d8698a; font-size: clamp(30px, 9vw, 42px);
    margin: 0 0 20px; text-align: center;
  }
  .letter-card p {
    font-family: Georgia, "Times New Roman", serif; font-size: clamp(15px, 4.3vw, 17px);
    line-height: 1.85; color: #7a5560; margin: 0 0 15px; text-wrap: pretty;
  }
  .letter-card .sign {
    font-family: "Snell Roundhand", "Segoe Script", cursive;
    font-size: 28px; color: #d8698a; text-align: right; margin-top: 10px;
  }

  /* --- notes board --- */
  .board { max-width: 940px; margin: 0 auto; padding: 46px 18px 96px; }
  .board h2 {
    font-family: "Snell Roundhand", "Segoe Script", cursive;
    color: #d8698a; font-weight: 600; font-size: clamp(28px, 8vw, 40px);
    text-align: center; margin: 0 0 4px;
  }
  .board .sub {
    text-align: center; font-family: Georgia, serif; font-style: italic;
    color: #a06d7a; margin: 0 0 26px; font-size: 15px;
  }
  .note-form {
    display: flex; flex-direction: column; gap: 10px;
    max-width: 460px; margin: 0 auto 42px;
    background: rgba(255,255,255,0.72); border-radius: 18px; padding: 16px;
    box-shadow: 0 12px 34px rgba(216,105,138,0.12);
  }
  .note-form textarea, .note-form input {
    border: 1px solid rgba(216,105,138,0.25); border-radius: 12px;
    padding: 12px 14px; color: #7a5560; background: #fffdfc; outline: none;
    font-family: Georgia, serif;
  }
  .note-form textarea { font-size: 16px; line-height: 1.5; resize: vertical; min-height: 74px; }
  .note-form textarea:focus, .note-form input:focus { border-color: #ff9dc2; }
  .note-form .row { display: flex; gap: 10px; }
  .note-form input { flex: 1; font-size: 15px; }
  .note-form button {
    border: none; cursor: pointer; border-radius: 12px; padding: 11px 20px;
    font: 600 15px -apple-system, system-ui, sans-serif; color: #fff; white-space: nowrap;
    background: linear-gradient(135deg, #ff9dc2, #d8698a);
    box-shadow: 0 6px 16px rgba(216,105,138,0.35);
    transition: transform 0.12s ease, filter 0.15s ease;
  }
  .note-form button:active { transform: scale(0.96); }
  .note-form button:disabled { filter: grayscale(0.4) opacity(0.6); cursor: default; }
  .board .status {
    text-align: center; color: #a06d7a; font-family: Georgia, serif;
    font-style: italic; padding: 18px;
  }
  /* the cork pin-board the notes live on */
  .notes-grid {
    columns: 4 156px; column-gap: 18px;
    padding: 28px 22px 32px;
    border-radius: 12px;
    background-color: #d3a969;
    background-image:
      radial-gradient(circle at 15% 25%, rgba(90,60,25,0.16) 0 1.5px, transparent 2px),
      radial-gradient(circle at 60% 65%, rgba(90,60,25,0.13) 0 1.5px, transparent 2px),
      radial-gradient(circle at 82% 32%, rgba(255,240,210,0.20) 0 1.5px, transparent 2px),
      radial-gradient(circle at 38% 82%, rgba(90,60,25,0.12) 0 1.5px, transparent 2px);
    background-size: 26px 26px, 34px 34px, 22px 22px, 30px 30px;
    box-shadow: inset 0 0 44px rgba(80,50,20,0.35), 0 16px 36px rgba(120,80,40,0.28);
    border: 11px solid #9c6a34;
    border-image: linear-gradient(145deg, #b8834a, #7c4e22) 1;
    min-height: 200px;
  }
  .note {
    break-inside: avoid; margin: 0 0 18px; padding: 18px 15px 14px;
    position: relative;
    box-shadow: 0 7px 14px rgba(40,25,10,0.28);
    transform: rotate(var(--tilt, -2deg));
    animation: notePop 0.45s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .note::before { /* pushpin */
    content: ""; position: absolute; top: -7px; left: 50%; transform: translateX(-50%);
    width: 15px; height: 15px; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #fff, var(--pin, #d63b3b) 60%, rgba(0,0,0,0.4));
    box-shadow: 0 3px 4px rgba(0,0,0,0.35);
  }
  .note .body {
    font-family: "Bradley Hand", "Marker Felt", "Segoe Print", "Comic Sans MS", cursive;
    font-size: 16px; line-height: 1.45;
    color: #4a3a2e; white-space: pre-wrap; word-break: break-word;
  }
  .note .meta {
    margin-top: 10px; font: 12px "Bradley Hand", "Marker Felt", cursive;
    color: rgba(60,45,30,0.6); display: flex; justify-content: space-between; gap: 8px;
  }
  .note .meta .who { font-weight: 700; color: rgba(60,45,30,0.85); }
  @keyframes notePop {
    0%   { opacity: 0; transform: rotate(var(--tilt, -2deg)) scale(0.7); }
    100% { opacity: 1; transform: rotate(var(--tilt, -2deg)) scale(1); }
  }

  /* ---------- note wall screen ---------- */
  @keyframes swayNote { 0%,100% { transform: rotate(var(--tilt)); } 50% { transform: rotate(calc(var(--tilt) + 0.7deg)); } }
  @keyframes twinkle { 0%,100% { opacity: 0.18; transform: scale(0.85); } 50% { opacity: 0.8; transform: scale(1.12); } }
  @keyframes driftUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    14%  { opacity: 0.45; }
    86%  { opacity: 0.45; }
    100% { transform: translateY(-108vh) rotate(200deg); opacity: 0; }
  }
  .wall {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 6; display: none;
    height: 100vh; height: 100dvh;   /* full screen incl. the bottom safe-area, so its cream fills it (no pink chunk) */
    overflow: hidden;
    padding: max(30px, env(safe-area-inset-top)) 22px max(22px, env(safe-area-inset-bottom)); color: #74505c;
    background-color: #fffaf1;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,240,190,0.34), transparent 48%),
      radial-gradient(circle at 84% 34%, rgba(255,214,228,0.30), transparent 48%),
      repeating-linear-gradient(90deg, rgba(244,150,178,0.055) 0 30px, transparent 30px 60px),
      repeating-linear-gradient(0deg, rgba(244,150,178,0.055) 0 30px, transparent 30px 60px),
      repeating-linear-gradient(90deg, rgba(255,206,110,0.05) 0 3px, transparent 3px 60px),
      repeating-linear-gradient(0deg, rgba(255,206,110,0.05) 0 3px, transparent 3px 60px);
    background-position: 0 0, 0 0, 8px 8px, 8px 8px, 0 0, 0 0;
  }
  .wall.show { display: flex; flex-direction: column; }
  .wall-frame { position: absolute; inset: 18px; z-index: 0; pointer-events: none; border-radius: 20px; border: 2px solid rgba(214,150,178,0.6); box-shadow: inset 0 0 0 5px rgba(255,255,255,0.4), 0 6px 20px rgba(204,100,136,0.06); }
  /* phone-only cute chrome — hidden on desktop (desktop keeps the plain .wall-frame) */
  .wall-banner, .wall-banner-scallop, .wall-banner-hearts, .wall-ears, .wall-curtain-deco, .ws-heart, .wall-safebot { display: none; }
  .wall-sheet { display: contents; }   /* desktop: transparent to layout; phone turns it into the framed sheet */

  /* PHONE VIEW (exclusive): scalloped pink banner + ears round the Dynamic Island + a scalloped,
     dashed frame. The banner/ears/frame are pinned; the header + notes scroll underneath them.
     Rules scoped under .wall so they out-specify the base .wall-* rules later in this stylesheet. */
  @media (max-width: 600px) {
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    .wall.show {
      display: block; position: fixed; inset: 0;
      height: auto; overflow: hidden; padding: 0;   /* let inset:0 span to the true screen bottom (100dvh can fall short of the home-indicator edge) */
      --bh: max(58px, env(safe-area-inset-top), var(--sat, 0px));   /* banner height clears the notch */
    }
    .wall .wall-frame { display: none; }

    /* cream panel that physically extends the board into the bottom safe-area (home-indicator zone),
       so no page background can show as a pink strip there. z:3 keeps it BEHIND the notes (z:4) — it
       only ever paints where the scroller isn't, i.e. the strip itself, never clipping content. */
    .wall .wall-safebot { display: block; position: fixed; left: 0; right: 0; bottom: 0;
      height: calc(max(env(safe-area-inset-bottom), var(--sab, 0px)) + 30px);
      background: #fffaf1; z-index: 3; pointer-events: none; }

    /* pink scalloped banner across the very top */
    .wall .wall-banner { display: block; position: absolute; top: 0; left: 0; right: 0; height: var(--bh); z-index: 6;
      background: linear-gradient(180deg, #ffe6ee 0%, #ffd8e6 100%); }
    .wall .wall-banner-scallop { display: block; position: absolute; top: var(--bh); left: 0; right: 0; height: 16px; z-index: 6;
      background-image: radial-gradient(circle 11px at 11px 0, #ffd8e6 10.4px, rgba(255,255,255,0) 10.9px);
      background-size: 22px 16px; background-repeat: repeat-x; }
    .wall .wall-banner-hearts { display: flex; position: absolute; top: calc(var(--bh) + 13px); left: 0; right: 0; height: 12px; z-index: 6;
      justify-content: space-around; padding: 0 12px; font-size: 9px; line-height: 9px; color: rgba(214,110,145,0.7); }

    /* ୨♡୧ flourish sits on the curtain, centred just under the island */
    .wall .wall-curtain-deco { display: block; position: absolute; top: calc(var(--bh) - 12px); left: 0; right: 0; z-index: 8;
      text-align: center; font-size: 12px; letter-spacing: 3px; color: #c17a97; }
    .wall .wall-head .wall-deco { display: none; }   /* moved onto the curtain; don't repeat it in the header */

    /* cat-ears flanking the Dynamic Island */
    .wall .wall-ears { display: block; }
    .wall .wall-ear { position: absolute; z-index: 7; transform-origin: bottom center; }
    .wall .ear-lo { top: 0; left: 50%; margin-left: -82px; width: 34px; height: 36px; background: #111; transform: rotate(-12deg);
      clip-path: path('M18,1 C25,9 30,20 31,27 C31,31 27,32 22,31 C16,30 10,30 5,31 C1,32 0,30 1,27 C3,19 10,8 18,1 Z'); }
    .wall .ear-li { top: 10px; left: 50%; margin-left: -74px; width: 17px; height: 16px; transform: rotate(-12deg);
      background: linear-gradient(165deg,#ffc8db,#ef94b3);

    /* the scroller fills the screen under the curtain; it doesn't draw the frame itself */

  /* ---------- merged site + board ---------- */
  .home {

  }
  .home.show { display: block; }
  /* transition: a soft transparent band that SWEEPS from the bottom upward, revealing the board.
     The mask image is 200vh tall (opaque top half, feathering to transparent lower half); we slide
     its position up over time so the transparent front rises bottom→top. The content also swipes
     up. mask-position-y and translate are both driven from one eased progress. */
  .home.revealing {
    /* Solid plateau (0–45%) covers the whole viewport at rest → home fully opaque, no peek.
       Then a SMOOTHSTEP ease to transparent (45→100%): the opacity slope starts at ~0 and grows
       gradually, so there is NO knee/corner anywhere — nothing for the eye to read as a line as
       the mask slides up. The fade front still enters from the bottom and sweeps upward. */
    -webkit-mask-image: linear-gradient(to bottom,
      #000 0%, #000 45%,
      rgba(0,0,0,0.99) 50%, rgba(0,0,0,0.95) 56%, rgba(0,0,0,0.86) 62%,
      rgba(0,0,0,0.72) 68%, rgba(0,0,0,0.55) 74%, rgba(0,0,0,0.38) 80%,

      #000 0%, #000 45%,
      rgba(0,0,0,0.99) 50%, rgba(0,0,0,0.95) 56%, rgba(0,0,0,0.86) 62%,
      rgba(0,0,0,0.72) 68%, rgba(0,0,0,0.55) 74%, rgba(0,0,0,0.38) 80%,
      rgba(0,0,0,0.22) 86%, rgba(0,0,0,0.10) 92%, rgba(0,0,0,0.03) 96%, transparent 100%);
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-size: 100% 250vh; mask-size: 100% 250vh;
    will-change: -webkit-mask-position, mask-position;

  .add-inner {

<body>
  <!-- persistent living backdrop (gradient base on <body>) — shows behind every screen -->

    <div class="success" id="success">

      <div class="card">
        <div class="big">💝</div>
        <div class="mono">
          <span class="letter">M</span><span class="h">♡</span><span class="letter">V</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ✨ The real site lives here — starter content, we'll shape it together. -->
  <main class="site" id="site"></main>

  <!-- 🌸 Bloom transition screen — petals recreated in pure CSS (no image assets). -->
  <div class="bloom" id="bloom"></div>

  <!-- 📝 Note wall preview screen (debug tab for now) -->

  <!-- ✎ Add-a-note creator screen -->

  <!-- ✎ Drawing screen -->

      }

      html += '<div class="wnote' + (n.locked === false ? " movable" : "") + '" data-i="' + i + '" style="' + stW(wrap) + '">' + noteInner(s, n.body, n.author, noteH) + "</div>";
    }

    wallNotes.innerHTML = html;

    document.getElementById("wallAdd").addEventListener("click", showAdd);

    // ----- drag to place · tap to open -----
    var modal = document.getElementById("wallModal");
    function closeModal() { modal.classList.remove("open"); modal.innerHTML = ""; }
    function openNoteModal(idx) {
      var n = NOTES[idx], s = resolveNoteStyle(n);

      modal.innerHTML =
        '<div class="wm-stage">' +

            '<button class="wm-tool" data-act="edit" title="edit">✎</button>' +

    }
    function deleteNote(idx) {

    function editNote(idx) {

      addDraft = { body: n.body, author: n.author, color: s.color, inkColor: s.inkColor >= 0 ? s.inkColor : 0, paper: s.paper, edge: s.curved ? "curved" : "sharp", folded: s.folded, doodle: s.doodle, fasten: s.fasten, pin: s.pin, pinColor: s.pinColor, tape: s.tape, tapePat: s.tapePat, tilt: s.tilt, size: s.size, strokes: (n.strokes || []).map(function (st) { return { color: st.color, w: st.w, pts: st.pts.slice() }; }) };

    // make note `idx` the single movable one (locks all the others)
    var placeBtn = document.getElementById("wallPlace");
    placeBtn.addEventListener("click", relockAll);
    function unlockNote(idx) {

    }
    if (NOTES.some(function (n) { return n.locked === false; })) placeBtn.classList.add("show"); // a just-added note is already movable

    var drag = null;
    wallNotes.addEventListener("pointerdown", function (e) {
      var el = e.target.closest(".wnote");
      if (!el) { relockAll(); return; }              // clicked empty board → lock the movable note
      var idx = +el.getAttribute("data-i");
      if (NOTES[idx].locked !== false) relockAll();  // clicked a different (locked) note → lock the movable one
      drag = { el: el, idx: idx, sx: e.clientX, sy: e.clientY, ol: parseFloat(el.style.left), ot: parseFloat(el.style.top), w: el.offsetWidth, moved: false, movable: NOTES[idx].locked === false };

    });
    wallNotes.addEventListener("pointermove", function (e) {
      if (!drag) return;

    });
    function endDrag() {

          var left = parseFloat(d.el.style.left), top = parseFloat(d.el.style.top);

          patchNote(NOTES[d.idx], { x: NOTES[d.idx].x, y: NOTES[d.idx].y }); // persist the move
        } else {
          openNoteModal(d.idx);                            // tapped the movable note → just read it
        }
      } else if (!d.moved) {
        openNoteModal(d.idx);                              // tap a locked note → open it (use the move ✥ tool to unlock)
      }

  function renderDraw() {
    var s = resolveNoteStyle(addDraft);
    var sBg = {}; for (var kk in s) sBg[kk] = s[kk]; sBg.strokes = []; // note look, minus the drawing (canvas handles that)
    var size = Math.min(340, window.innerWidth - 56); // identical to the creator preview, so the note never rescales when toggling draw mode
    drawStrokes = (addDraft.strokes || []).map(function (st) { return { color: st.color, w: st.w, pts: st.pts.slice() }; });

    function sw(list, key, val) { return list.map(function (o) { var v = key === "color" ? o : o.w; var sel = v === val ? " sel" : ""; if (key === "color") return '<span class="opt-swatch' + sel + '" data-dc="' + o + '" style="background:' + o + '"></span>'; return '<button class="opt' + sel + '" data-dw="' + o.w + '">' + o.label + "</button>"; }).join(""); }

            '<canvas id="drawCanvas" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;z-index:6;border-radius:' + (s.curved ? "16px" : "3px") + '"></canvas>' +

          '<div class="add-label">brush size</div>' +
          '<div class="draw-size-row"><input type="range" id="drawRange" min="0.6" max="6.5" step="0.1" value="' + drawW + '"><span class="draw-size-dot" id="drawDot"></span></div>' +
          '<div class="add-opts" style="margin-top:14px">' +
            '<button class="add-btn ghost" id="drawUndo">↶ undo</button>' +
            '<button class="add-btn ghost" id="drawClear">clear</button>' +
            '<button class="add-btn primary" id="drawDone">done ✓</button>' +
          "</div>" +
        "</div>" +

    var canvas = document.getElementById("drawCanvas");
    var ctx = canvas.getContext("2d");
    var dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr; canvas.height = size * dpr; ctx.scale(dpr, dpr);
    function paintStroke(st) {
      if (!st.pts.length) return;

    redraw();

    var cur = null;
    function at(e) { var r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; }

    canvas.addEventListener("pointermove", function (e) { if (!cur) return; cur.pts.push(at(e)); redraw(); paintStroke(cur); });

    document.getElementById("drawDone").onclick = function () { addDraft.strokes = drawStrokes.map(function (st) { return { color: st.color, w: st.w, pts: st.pts }; }); showAdd(); };

  function renderHome() {
    // the site (hero + letter) is the resting state; a tiny scroll transitions to the board
    var heroEl = siteEl.querySelector(".hero"), letterEl = siteEl.querySelector(".letter");
    var topHTML = (heroEl ? heroEl.outerHTML : "<section class='hero'><h1>Welcome, my love</h1></section>") + (letterEl ? letterEl.outerHTML : "");
    homeEl.innerHTML = '<div class="site home-site">' + topHTML + "</div>";
  }

  // a small scroll/swipe just TRIGGERS a full self-playing slide between site and board
  // A single "reveal amount" v (0 = home fully shown, 1 = fully dissolved/board shown) drives both:
  //   • the mask position — the soft transparent band sweeps from the bottom up the screen;
  //   • the content translate — the page swipes up like a real scroll.
  // vFrom/vTo let us play it forward (0→1, to board) or backward (1→0, back home).
  var navRaf = 0; // id of the in-flight transition frame, so we never stack two loops
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function animMask(vFrom, vTo, done) {
    var t0 = null, dur = 760;
    var inner = homeEl.querySelector(".home-site") || homeEl;
    function apply(v) {
      // slide the 250vh mask up: at v=0 the opaque plateau (0-45% = 0-112vh) fully covers the
      // 100vh viewport (solid, no peek); as v→1 the smoothstep fade sweeps in from the bottom and
      // up until fully dissolved (y=-250vh puts the viewport past the transparent end).
      var y = (-250 * v).toFixed(1) + "vh";
      homeEl.style.webkitMaskPosition = "0 " + y;
      homeEl.style.maskPosition = "0 " + y;
      inner.style.transform = "translate3d(0," + (-110 * v).toFixed(2) + "vh,0)"; // swipe up
    }
    function finish() {
      inner.style.transform = "";
      homeEl.style.webkitMaskImage = ""; homeEl.style.maskImage = "";
      homeEl.style.webkitMaskPosition = ""; homeEl.style.maskPosition = "";
      if (done) done();
    }
    if (navRaf) { cancelAnimationFrame(navRaf); navRaf = 0; } // never run two at once
    if (reduceMotion) { apply(vTo); finish(); return; }        // no motion → snap to end state
    apply(vFrom);
    function step(ts) {
      if (t0 == null) t0 = ts;
      var p = Math.min(1, (ts - t0) / dur);
      var e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; // ease-in-out
      apply(vFrom + (vTo - vFrom) * e);
      if (p < 1) { navRaf = requestAnimationFrame(step); }
      else { navRaf = 0; finish(); }
    }
    navRaf = requestAnimationFrame(step);
  }
  function navToBoard() {
    if (navBusy || navState !== "home") return;
    navBusy = true; navState = "animating";
    backdropEl.style.display = "";                 // board's living backdrop
    wallEl.classList.add("show");                  // show FIRST so the board has real dimensions...
    void wallEl.offsetWidth;                        // ...force layout...
    renderWall();                                   // ...then render, so notes size/place exactly like the Wall tab
    homeEl.classList.add("revealing");
    animMask(0, 1, function () {  // transparent band sweeps bottom→up + content swipes up, revealing board
      homeEl.classList.remove("show", "revealing");
      navState = "board"; navBusy = false;
    });
  }
  function navToHome() {
    if (navBusy || navState !== "board") return;
    navBusy = true; navState = "animating";
    homeEl.classList.add("show", "revealing");
    animMask(1, 0, function () {  // band recedes back down + content swipes down as the site fills in
      wallEl.classList.remove("show"); wallEl.innerHTML = "";
      backdropEl.style.display = "none"; // home is flat cream, no living backdrop
      homeEl.classList.remove("revealing");
      navState = "home"; navBusy = false;
    });
  }

  window.addEventListener("wheel", function (e) {
    if (!homeActive) return;
    if (navState === "home" && e.deltaY > 6) { e.preventDefault(); navToBoard(); }
    else if (navState === "board" && e.deltaY < -6) { e.preventDefault(); navToHome(); }
  }, { passive: false });
  var navTouchY = null;
  window.addEventListener("touchstart", function (e) { if (homeActive) navTouchY = e.touches[0].clientY; }, { passive: true });
  window.addEventListener("touchmove", function (e) {
    if (!homeActive || navTouchY == null) return;
    var dy = navTouchY - e.touches[0].clientY; // >0 = swipe up
    if (navState === "home" && dy > 34) { navTouchY = null; navToBoard(); }
    else if (navState === "board" && dy < -34 && !e.target.closest(".wnote")) { navTouchY = null; navToHome(); }
  }, { passive: true });

  // ---------- notes board (Supabase) ----------
  // In the published build these two are blanked and get filled by
  // decryptPayload() on a correct unlock (build.js handles that).
  var SUPABASE_URL = "";
  var SUPABASE_KEY = "";
  var NOTE_COLORS = ["#fff59d", "#ffd1dc", "#bfe0ff", "#c8f0c8", "#ffe0b3", "#e6d4ff"]; // sticky-note pastels
  var PIN_COLORS = ["#d63b3b", "#3b74d6", "#e0a021", "#3bb06a", "#c33bd6"];             // pushpins
  var notesInited = false;

  function notesEndpoint() { return SUPABASE_URL + "/rest/v1/notes"; }
  function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
  function fmtDate(iso) {
    try { return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); }
    catch (e) { return ""; }
  }

  function renderNotes(list) {
    var grid = document.getElementById("notesGrid");
    var statusEl = document.getElementById("notesStatus");
    if (!grid) return;
    grid.innerHTML = "";
    if (!list || !list.length) {
      if (statusEl) { statusEl.style.display = ""; statusEl.textContent = "no notes yet — be the first to leave one 💕"; }
      return;
    }
    if (statusEl) statusEl.style.display = "none";
    list.forEach(function (n, i) {
      var el = document.createElement("div");
      el.className = "note";
      el.style.background = n.color || NOTE_COLORS[i % NOTE_COLORS.length];
      el.style.setProperty("--tilt", (((i * 53) % 9) - 4) + "deg");   // stable per-note lean, -4..4°
      el.style.setProperty("--pin", PIN_COLORS[i % PIN_COLORS.length]);
      var who = n.author ? '<span class="who">' + esc(n.author) + "</span>" : '<span class="who">&nbsp;</span>';
      el.innerHTML = '<div class="body">' + esc(n.body) + "</div>" +
                     '<div class="meta">' + who + "<span>" + fmtDate(n.created_at) + "</span></div>";
      grid.appendChild(el);
    });
  }

  function loadNotes() {
    var grid = document.getElementById("notesGrid");
    var statusEl = document.getElementById("notesStatus");
    if (!grid) return;
    if (statusEl) { statusEl.style.display = ""; statusEl.textContent = "loading our notes…"; }
    fetch(notesEndpoint() + "?select=*&order=created_at.desc", {
      headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY }
    })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(renderNotes)
      .catch(function (e) {
        if (statusEl) { statusEl.style.display = ""; statusEl.textContent = "couldn't load our notes right now 😢"; }
        console.error("[notes] load failed", e);
      });
  }

  // attach the "pin a note" handler once the board is in the DOM (dev: at load; prod: after unlock)
  function initNotes() {
    if (notesInited) return;
    var form = document.getElementById("noteForm");
    if (!form) return;
    notesInited = true;
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var bodyEl = document.getElementById("noteBody");
      var authorEl = document.getElementById("noteAuthor");
      var body = bodyEl.value.trim();
      if (!body) return;
      var author = authorEl.value.trim();
      var color = NOTE_COLORS[Math.floor(Math.random() * NOTE_COLORS.length)];
      var btn = form.querySelector("button");
      btn.disabled = true;
      fetch(notesEndpoint(), {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json", Prefer: "return=representation"
        },
        body: JSON.stringify({ body: body, author: author || null, color: color })
      })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function () { bodyEl.value = ""; loadNotes(); })
        .catch(function (e) { console.error("[notes] post failed", e); alert("Couldn't pin that note — try again in a sec 💗"); })
        .then(function () { btn.disabled = false; });
    });
  }

  // a pretty layered cherry-blossom, drawn in SVG.
  // Each layer is its own stacked SVG so it can bloom in on its own delay.
  function renderBloom() {
    // one petal, pointing up, base at the center (100,100), notched tip at the top
    var petal = "M100 100 C70 92 58 56 78 30 C83 22 91 22 100 35 C109 22 117 22 122 30 C142 56 130 92 100 100 Z";

    var N = 9; // 💐 nine layers — one for each month together

    // blend two hex colors, t = 0 (a) → 1 (b)
    function hx(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
    function mix(a, b, t) {
      var A = hx(a), B = hx(b);
      return "#" + [0, 1, 2].map(function (k) {
        var v = Math.round(A[k] + (B[k] - A[k]) * t);
        return ("0" + v.toString(16)).slice(-2);
      }).join("");
    }

    // each layer's petal gradient is interpolated between a light (front)
    // and a deep (back) palette, so layer N is always a step darker than N-1.
    var stopDefs = [
      [0,   "#fffdfe", "#ffe6f0"],  // near-center: stays bright
      [0.5, "#ffe8f1", "#ff9dc0"],  // middle
      [1,   "#ffccde", "#df5d89"]   // tip: deepens the most
    ];
    function petalGrad(i, t, radius) {
      var stops = stopDefs.map(function (s) {
        return '<stop offset="' + s[0] + '" stop-color="' + mix(s[1], s[2], t) + '"/>';
      }).join("");
      return '<radialGradient id="petalFill' + i + '" cx="100" cy="100" r="' + radius +
             '" gradientUnits="userSpaceOnUse">' + stops + '</radialGradient>';
    }
    var CORE_GRAD =
      '<radialGradient id="coreFill" cx="100" cy="97" r="15" gradientUnits="userSpaceOnUse">' +
        '<stop offset="0" stop-color="#fff7d6"/>' +
        '<stop offset="0.6" stop-color="#ffe08c"/>' +
        '<stop offset="1" stop-color="#f4b64f"/>' +
      '</radialGradient>';

    function svgWrap(defsInner, inner) {
      return '<svg viewBox="0 0 200 200" width="180" height="180" xmlns="http://www.w3.org/2000/svg">' +
             '<defs>' + defsInner + '</defs>' + inner + '</svg>';
    }
    function petalsMarkup(count, fillId, stroke, scale, rot) {
      var p = "", step = 360 / count;
      for (var i = 0; i < count; i++) {
        p += '<path d="' + petal + '" fill="url(#' + fillId + ')" stroke="' + stroke + '" ' +
             'stroke-opacity="0.22" stroke-width="1" ' +
             'transform="rotate(' + (i * step + step / 2 + rot) + ' 100 100)"/>';
      }
      return '<g transform="translate(100 100) scale(' + scale + ') translate(-100 -100)">' + p + '</g>';
    }

    // stamens + golden centre
    var core = "";
    for (var s = 0; s < 10; s++) {
      var ang = (Math.PI * 2 / 10) * s, r = 17;
      var x = (100 + Math.cos(ang) * r).toFixed(1), y = (100 + Math.sin(ang) * r).toFixed(1);
      core += '<line x1="100" y1="100" x2="' + x + '" y2="' + y + '" stroke="#f6c14b" stroke-width="1.4"/>' +
              '<circle cx="' + x + '" cy="' + y + '" r="2.2" fill="#f4a63a"/>';
    }
    core += '<circle cx="100" cy="100" r="11" fill="url(#coreFill)"/>';

    var lightGrad = petalGrad(0, 0.32, 96);   // id petalFill0 — soft front petals
    var deepGrad  = petalGrad(1, 0.72, 122);  // id petalFill1 — deeper back petals (a tad darker)

    // a little white twinkle at the petal tip, flashing as the petal pops
    function spark(begin) {
      return '<g class="spk" style="animation-delay:' + begin.toFixed(2) + 's">' +
             '<path d="M100 13 L100 31 M91 22 L109 22" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>' +
             '<circle cx="100" cy="22" r="2" fill="#fff"/></g>';
    }
    // one petal at `angle`, optionally scaled, with its tip sparkle
    function petalUnit(angle, scale, fillId, stroke, begin) {
      var body = '<path d="' + petal + '" fill="url(#' + fillId + ')" stroke="' + stroke + '" ' +
                 'stroke-opacity="0.25" stroke-width="1"/>' + spark(begin);
      if (scale && scale !== 1) body = '<g transform="translate(100 100) scale(' + scale + ') translate(-100 -100)">' + body + '</g>';
      return '<g transform="rotate(' + angle + ' 100 100)">' + body + '</g>';
    }
    function petalDiv(gradDef, angle, scale, fillId, stroke, delay) {
      return '<div class="bloom-petal" style="animation-delay:' + delay.toFixed(2) + 's">' +
             svgWrap(gradDef, petalUnit(angle, scale, fillId, stroke, delay + 0.05)) + '</div>';
    }

    var STEP = 0.15;
    var OFF = 0.4; // petals wait for the centre to appear first

    // the golden centre appears first (the heart of the flower), then a 5-petal
    // blossom opens around it, then 4 more grow in behind (5 → 9) — one per month.
    var h = '<div class="blossom">';
    var backAngles = [36, 108, 180, 252];          // 4 back petals filling the gaps of the 5
    for (var b = 0; b < 4; b++)                     // DOM-first so they paint behind…
      h += petalDiv(deepGrad, backAngles[b], 1.28, "petalFill1", "#f97ba4", OFF + (5 + b) * STEP + 0.1); // …but appear after the 5
    for (var i = 0; i < 5; i++)
      h += petalDiv(lightGrad, i * 72, 1, "petalFill0", "#ff97bd", OFF + i * STEP);
    // centre first (delay 0), and last in the DOM so it stays on top
    h += '<div class="bloom-petal" style="animation-delay:0s">' + svgWrap(CORE_GRAD, core) + '</div>';
    h += '</div>';

    bloomEl.innerHTML = h;
  }

  // 🔧 DEBUG BAR — dev only, remove before sharing.
  var debugbar = document.getElementById("debugbar");
  function markDebug(name) {
    if (!debugbar) return;
    var btns = debugbar.querySelectorAll("button");
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle("active", btns[i].getAttribute("data-screen") === name);
    }
  }
  var centerguide = document.getElementById("centerguide");
  if (debugbar) {
    debugbar.addEventListener("click", function (e) {
      var t = e.target.closest("[data-toggle]");
      if (t && t.getAttribute("data-toggle") === "center") {
        var on = centerguide.classList.toggle("on");
        t.classList.toggle("active", on);
        return;
      }
      var b = e.target.closest("[data-screen]");
      if (!b) return;
      var s = b.getAttribute("data-screen");
      if (s === "lock") showLock();
      else if (s === "celebrate") showCelebration();
      else if (s === "bloom") showBloom();
      else if (s === "site") showSite();
      else if (s === "wall") { showWall(); loadWallNotes(); }
      else if (s === "add") showAdd();
      else if (s === "draw") showDraw();
      else if (s === "home") showHome();
    });
  }

  
})();

// ---------- PWA: register the service worker (only over http/https — no-ops on file://) ----------
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () { /* offline install is best-effort */ });
  });
}
</script>
