  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* height: 100vh, NOT 100% — this is the fix for the iOS "chin gap" (the white bar above the home
     indicator). With viewport-fit=cover + apple-mobile-web-app-status-bar-style: black-translucent,
     WebKit offsets the whole view up by the status-bar height (~59px) but does NOT grow the viewport, so
     a 100%-height html/body ends ~59px short of the screen bottom and the webview's own white shows
     through there. No page paint can reach it — that zone is outside the document box. 100vh resolves
     against the real viewport instead of the containing block, so the document covers the full screen.
     100dvh does NOT fix it. Keep this even if the meta tags change later; it costs nothing. */
  /* scroll, never zoom: pan-y allows vertical scrolling and nothing else — no pinch, no double-tap zoom.
     touch-action does NOT inherit; a gesture's effective value is intersected with its ancestors', so this
     alone does block zoom anywhere in the page — but the scrollers below set it explicitly rather than
     leaning on that. The drawing canvas keeps touch-action:none (it needs raw touches; also blocks zoom). */
  html, body { margin: 0; padding: 0; height: 100vh; touch-action: pan-y; -webkit-text-size-adjust: 100%; }
  /* ROOT SKINS — no bottom strip, on any screen.
     iOS paints the bottom safe-area (home-indicator) zone from the ROOT background, so whatever <html>
     carries IS that zone. Two rules kill the visible band:
       1. background-attachment: fixed — the background's positioning area becomes the VIEWPORT, so the
          gradient/pattern actually extends across the safe-area zone. Without it the positioning area is
          the (shorter) html box and the zone falls back to the flat colour underneath, which reads as a
          band: a 160deg gradient only reaches its end colour in one corner, so a flat backstop matching
          that end colour still mismatches the rest of the width.
       2. every screen switches the root to the SAME paint its own bottom edge shows, via rootSkin()
          below — so there is nothing for a seam to be visible between.
     This default skin is the lock / bloom / celebration screens (whose backdrop is the root gradient). */
  html { background: linear-gradient(160deg, #ffe6ee 0%, #fff2e6 46%, #ffe0ea 78%, #ffd9e6 100%) #ffd9e6;
         background-attachment: fixed; }
  /* the warm cream of the board screens */
  html.rt-warm { background: linear-gradient(160deg, #fff6f2 0%, #fff8f0 100%) #fff8f0; background-attachment: fixed; }
  /* note board + add/draw: flat cream matching those screens' own base colour. The screens paint their
     own checkered pattern on top; this is just the backstop the safe-area zone shows. */
  html.rt-board { background: #fffaf1; }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    color: #6f4a54;
    overflow: hidden;
    background: transparent; /* the canvas (<html>) carries the gradient now, so safe-areas blend seamlessly */
  }

  /* ---------- animations ---------- */
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    12%  { opacity: var(--peak, 0.5); }
    88%  { opacity: var(--peak, 0.5); }
    100% { transform: translateY(-112vh) rotate(220deg); opacity: 0; }
  }
  @keyframes shimmer {
    0%   { transform: translate(-6%, -4%) scale(1); }
    50%  { transform: translate(6%, 4%) scale(1.12); }
    100% { transform: translate(-6%, -4%) scale(1); }
  }
  @keyframes shakeX {
    0%,100% { transform: translateX(0); }
    15% { transform: translateX(-9px); }
    30% { transform: translateX(8px); }
    45% { transform: translateX(-6px); }
    60% { transform: translateX(5px); }
    75% { transform: translateX(-3px); }
    90% { transform: translateX(2px); }
  }
  @keyframes checkPulse {
    0%,100% { transform: scale(1.18); opacity: 1; }
    50% { transform: scale(0.9); opacity: 0.5; }
  }
  @keyframes rain {
    0%   { transform: translateY(-12vh) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: translateY(112vh) rotate(300deg); opacity: 0; }
  }
  @keyframes cardIn {
    0%   { transform: scale(0.6) translateY(20px); opacity: 0; }
    60%  { transform: scale(1.06) translateY(0); opacity: 1; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  @keyframes heartBeat {
    0%,100% { transform: scale(1); }
    30% { transform: scale(1.18); }
    45% { transform: scale(0.96); }
    60% { transform: scale(1.09); }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- bloom screen ---------- */
  @keyframes petalOpen {
    0%   { transform: rotate(var(--a)) translateY(0) scale(0); opacity: 0; }
    30%  { opacity: 1; }
    100% { transform: rotate(var(--a)) translateY(calc(-1 * var(--len))) scale(1); opacity: 1; }
  }
  @keyframes growSpin {
    0%   { transform: translate(-50%,-50%) scale(0.25) rotate(-25deg); }
    100% { transform: translate(-50%,-50%) scale(1.25) rotate(28deg); }
  }
  @keyframes coreIn {
    0%   { transform: translate(-50%,-50%) scale(0); opacity: 0; }
    60%  { transform: translate(-50%,-50%) scale(1.25); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
  }
  @keyframes flash {
    0%   { transform: translate(-50%,-50%) scale(0); opacity: 0.95; }
    100% { transform: translate(-50%,-50%) scale(6); opacity: 0; }
  }
  @keyframes blackIn { 0% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes hintIn {
    0%   { opacity: 0; letter-spacing: 2px; }
    100% { opacity: 0.85; letter-spacing: 6px; }
  }

  /* ---------- stage ---------- */
  .backdrop { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .stage {
    position: relative;
    min-height: 100dvh;
    width: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    background: transparent; /* the persistent .backdrop shows through */
  }
  .shimmer {
    position: absolute; inset: -20%;
    pointer-events: none; z-index: 0;
    background:
      radial-gradient(38% 42% at 24% 28%, rgba(255,182,205,0.55), transparent 70%),
      radial-gradient(40% 44% at 78% 72%, rgba(255,214,168,0.50), transparent 72%),
      radial-gradient(34% 38% at 62% 18%, rgba(255,196,222,0.42), transparent 70%);
    animation: shimmer 16s ease-in-out infinite;
  }
  .hearts { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  .hearts span { position: absolute; bottom: -6vh; will-change: transform, opacity; }

  .panel {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    width: 100%; max-width: 340px;
  }

  .mono {
    display: flex; align-items: center; justify-content: center;
    width: 100%; margin-bottom: 34px;
    /* ONE knob for the whole lockup: the letters, the heart and every gap are em-based off this.
       110px because Gochi's letters are narrower than the fallback these numbers were first measured
       against — at 84px an M is only 58px wide, so the monogram had quietly shrunk. */
    font-size: 110px;
    /* No optical nudge any more. It existed to counter the cursive V's ink spilling right of its advance
       box; Gochi is an upright marker whose ink sits inside its box, so the same shift would just push the
       monogram visibly off-centre. */
  }
  .mono .letter {
    font-family: "Gochi Hand", "Bradley Hand", "Marker Felt", cursive;
    /* Gochi has one weight — asking for 600 only invites a browser to fake a bold */
    font-size: 1em; font-weight: 400; color: #d8698a; line-height: 1;
    /* Gochi's V starts 39 units LEFT of its own advance box (2.1px at this size). When the letter is
       promoted to a compositing layer for the draw-together transform, the layer texture is cut to the
       box — so that overhanging ink was being sliced off mid-animation. The padding gives the paint room
       and the equal negative margin gives it straight back to the layout, so nothing moves. */
    padding: 0 0.06em; margin: 0 -0.06em;
  }
  /* Margins are em-based so they scale with the monogram (big on the lock, small on the celebration card),
     and now SYMMETRIC: the old 0.8em/0.5em split was correcting for the cursive M and V, whose ink sat
     differently in their boxes. With Gochi the letters are upright and even, so an uneven split just pushed
     the heart 6px right of centre — measured, then equalised. It also makes the unlock pose symmetric,
     since both letters travel the same 1.28em inward. */
  /* 0.42em keeps the heart the same fraction of the letters it always was (it was 20px against 48px);
     at 0.36 it read small and lonely between letters this size. */
  .mono .h { font-size: 0.42em; color: #e58aa4; margin: 0 0.9em; transform: translateY(-0.03em); }
  /* The heart on the lock screen is a switch: tap it, it fills and glows, and the next correct passcode
     opens the settings instead of the board. Unlabelled on purpose — it's meant to be ours, not signposted.
     The tap target is an invisible skirt rather than padding, because padding on a flex item would shift
     the M and V apart. */
  /* The transform transition has to be repeated HERE. This is an id selector, so it out-specifies
     `.mono .h` — listing only colour and text-shadow silently dropped the heart's transform transition and
     the swell on unlock became a hard snap, which is exactly what it looked like. */
  #monoHeart { cursor: pointer; position: relative; -webkit-tap-highlight-color: transparent; user-select: none;
    transition: color 0.25s ease, text-shadow 0.25s ease,
                transform 1.05s cubic-bezier(0.16, 1, 0.3, 1) 0.12s; }
  #monoHeart::after { content: ""; position: absolute; inset: -14px; }
  #monoHeart.armed {
    color: #e0356b;
    text-shadow: 0 0 12px rgba(255,120,170,0.95), 0 0 28px rgba(255,90,150,0.55);
    animation: heartArm 1.7s ease-in-out infinite;
  }
  /* The armed pulse breathes with light, not with scale. It used to animate transform, which is the same
     property the swell transitions — so the moment .together killed the animation the heart snapped from
     wherever the pulse had it to full size, and no transition could smooth that. */
  @keyframes heartArm {
    0%, 100% { opacity: 0.82; text-shadow: 0 0 10px rgba(255,120,170,0.75), 0 0 22px rgba(255,90,150,0.4); }
    50%      { opacity: 1;    text-shadow: 0 0 16px rgba(255,120,170,1),    0 0 34px rgba(255,90,150,0.7); }
  }
  /* once the M and V draw together the heart has its own swell to do — the pulse would fight it */
  .mono.together .h { animation: none; }
  /* On unlock the M and V draw together and the heart swells. The letters keep the 0.75s ease-in-out that
     matches the passcode "checking" pulse; the HEART gets longer and softer — 1.05s on a decelerating curve
     with a beat of delay — because at 0.75s ease-in-out it snapped to full size almost at once and read as a
     pop rather than a swell. The choreography in onUnlockSuccess waits for it. */
  .mono .letter { transition: transform 0.75s ease-in-out; }
  .mono .h { transition: transform 1.05s cubic-bezier(0.16, 1, 0.3, 1) 0.12s; }
  /* How far each letter travels inward on unlock — and it has to stop OUTSIDE the heart, not under it.
     The ♡ is an outline glyph, so there is nothing to hide behind: overlap it and you see its stroke cross
     the letter's stroke, which reads as a tangle rather than a monogram. It also SWELLS to 1.5x here, which
     pushes its edges ~11px past its own box at this size, so the travel has to leave room for that too.
       gap at rest 41.6px  -  swell 11.3px  -  a few px of daylight  ->  ~26px  =  0.24em of .mono
     Measured at 0.44em the letters ended 18px INSIDE the swollen heart; at 0.58em, 37.7px inside each
     other. Both were tuned against a wider fallback font than Gochi actually is. */
  .mono.together > .letter:first-child { transform: translateX(0.24em); }
  .mono.together > .letter:last-child  { transform: translateX(-0.24em); }
  .mono.together .h { transform: translateY(-2px) scale(1.5); position: relative; z-index: 3; }


  .prompt {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic; font-size: 17px; letter-spacing: 0.2px;
    text-align: center; margin: 4px 0 26px; color: #935767;
    text-wrap: pretty;
  }

  .dots { display: flex; gap: 16px; margin-bottom: 40px; height: 22px; align-items: center; }
  .dots .dot {
    width: clamp(13px,3.6vw,16px); height: clamp(13px,3.6vw,16px);
    border-radius: 50%;
    border: 2px solid rgba(215,106,134,0.45);
    background: transparent;
    transform: scale(0.72);
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    display: inline-block;
  }
  .dots .dot.filled {
    border-color: #d76a86;
    background: radial-gradient(circle at 35% 30%, #ff9fb6, #d76a86);
    transform: scale(1.18);
    box-shadow: 0 3px 10px rgba(215,106,134,0.5);
  }
  .dots.checking .dot.filled { animation: checkPulse 0.75s ease-in-out infinite; }

  .pad {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: clamp(14px, 4.5vw, 20px); justify-items: center;
  }
  .key {
    width: clamp(62px,19vw,76px); height: clamp(62px,19vw,76px);
    border-radius: 50%; border: none;
    background: rgba(255,255,255,0.6);
    color: #8a5462;
    /* marker handwriting for the digits. Gochi has one weight and a smaller apparent size than the
       system face, so this is a touch larger and no longer light. ⌫ isn't in the latin subset, so the
       delete key falls back per-glyph on its own — which is what we want for a symbol. */
    font-size: clamp(30px,7.8vw,35px); font-weight: 400;
    font-family: "Gochi Hand", "Bradley Hand", "Marker Felt", cursive;
    padding-top: 2px;   /* the marker glyphs sit high in their line box */
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(216,105,138,0.18), inset 0 1px 0 rgba(255,255,255,0.8);
    transition: transform 0.12s ease, background 0.15s ease;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    user-select: none;
  }
  .key:active { transform: scale(0.9); background: rgba(255,196,214,0.85); }
  .key.del {
    background: transparent; box-shadow: none; color: #c07d8e;
    font-size: clamp(22px,6vw,26px);
  }
  .key.del:active { background: rgba(255,196,214,0.55); }
  .spacer { width: clamp(62px,19vw,76px); height: clamp(62px,19vw,76px); }

  /* ---------- tidying up (in the settings) ----------
     Removing things has no icon anywhere. A bin glyph is the one thing in here that looks bought rather
     than drawn, so this asks in words instead — "remove" turns into "remove this? yes / no" in the same
     hand as everything else. */
  .tidy-tabs { display: flex; gap: 8px; margin: 2px 0 4px; }
  .tidy-tab { flex: 1 1 0; padding: 11px 8px; border-radius: 14px; cursor: pointer;
    border: 1.5px solid rgba(216,105,138,0.32); background: #fff; color: #a05a72;
    font-family: "Snell Roundhand","Segoe Script",cursive; font-size: 20px; }
  .tidy-tab.on { background: linear-gradient(135deg, #ffd9e6, #ffc2d6); border-color: #e290ad; color: #8c3f5c; }
  .tidy-n { display: block; font-family: "Bradley Hand","Segoe Print",cursive; font-size: 11px; color: #c08fa2; }
  .tidy-tab.on .tidy-n { color: #a84c6c; }
  /* the same month grid the board's calendar uses, just narrower */
  .tidy-cal { margin: 12px 0 10px; }
  .tidy-cal .cal-year { margin-bottom: 9px; }
  .tidy-cal .cal-m { padding: 7px 2px 6px; font-size: 13px; }
  .tidy-cal .cal-m .n { font-size: 9.5px; }
  .tidy-grid { display: grid; gap: 12px; }
  .tidy-grid.notes { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); justify-items: center; }
  .tidy-grid.letters { grid-template-columns: 1fr; }
  .tidy-card { display: flex; flex-direction: column; gap: 6px; }
  /* the creator's miniature: the real note at 300px, scaled, with room above for the tape it hangs from */
  .tidy-mini { position: relative; overflow: hidden; }
  .tidy-shrink { position: absolute; top: 9px; left: 0; width: 300px; height: 300px; transform-origin: top left; }
  .tidy-env { pointer-events: none; }
  .tidy-foot { display: flex; align-items: baseline; gap: 8px; }
  .tidy-m { flex: 1 1 auto; min-width: 0; font-family: "Bradley Hand","Segoe Print",cursive; font-size: 11.5px;
    color: #b892a1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tidy-x, .tidy-yes, .tidy-no {
    flex: 0 0 auto; border: none; background: none; cursor: pointer; padding: 4px 2px;
    font-family: "Bradley Hand","Segoe Print",cursive; font-size: 13px; color: #c07d8e;
  }
  .tidy-ask { flex: 0 0 auto; display: none; align-items: baseline; gap: 6px;
    font-family: "Bradley Hand","Segoe Print",cursive; font-size: 12.5px; color: #a5808d; }
  .tidy-card.asking .tidy-ask { display: flex; }
  .tidy-card.asking .tidy-x { display: none; }
  .tidy-card.asking .tidy-m { display: none; }
  .tidy-yes { color: #c2566f; text-decoration: underline; }
  .tidy-no { color: #9d8390; text-decoration: underline; }
  .tidy-none { font-family: "Bradley Hand","Segoe Print",cursive; font-size: 12.5px; color: #b892a1; padding: 6px 0; }

  /* ---------- lock fade-out ---------- */
  .stage { transition: opacity 0.9s ease; }
  .stage.dismiss { opacity: 0; pointer-events: none; }
  .panel { transition: opacity 0.6s ease; }
  .panel.fade { opacity: 0; }

  /* ---------- note wall screen ---------- */
  /* the curtain's hearts glide sideways by exactly one tile period (300px), so it loops invisibly */
  @keyframes curtainDrift { from { transform: translate3d(0,0,0); } to { transform: translate3d(300px,0,0); } }
  @keyframes swayNote { 0%,100% { transform: rotate(var(--tilt)); } 50% { transform: rotate(calc(var(--tilt) + 0.7deg)); } }
  @keyframes twinkle { 0%,100% { opacity: 0.18; transform: scale(0.85); } 50% { opacity: 0.8; transform: scale(1.12); } }
  @keyframes driftUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    14%  { opacity: 0.45; }
    86%  { opacity: 0.45; }
    100% { transform: translateY(-108vh) rotate(200deg); opacity: 0; }
  }
  .wall {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 6; display: none;
    height: 100vh; height: 100dvh;   /* full screen incl. the bottom safe-area, so its cream fills it (no pink chunk) */
    overflow: hidden;
    --bh: 46px;   /* fallback only: the curtain that uses it is phone-only (see the display:none list) */
    padding: max(30px, env(safe-area-inset-top)) 22px max(22px, env(safe-area-inset-bottom)); color: #74505c;
    background-color: #fffaf1;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,240,190,0.34), transparent 48%),
      radial-gradient(circle at 84% 34%, rgba(255,214,228,0.30), transparent 48%),
      repeating-linear-gradient(90deg, rgba(244,150,178,0.055) 0 30px, transparent 30px 60px),
      repeating-linear-gradient(0deg, rgba(244,150,178,0.055) 0 30px, transparent 30px 60px),
      repeating-linear-gradient(90deg, rgba(255,206,110,0.05) 0 3px, transparent 3px 60px),
      repeating-linear-gradient(0deg, rgba(255,206,110,0.05) 0 3px, transparent 3px 60px);
    background-position: 0 0, 0 0, 8px 8px, 8px 8px, 0 0, 0 0;
  }
  .wall.show { display: flex; flex-direction: column; }
  .wall-frame { position: absolute; inset: 18px; z-index: 0; pointer-events: none; border-radius: 20px; border: 2px solid rgba(214,150,178,0.6); box-shadow: inset 0 0 0 5px rgba(255,255,255,0.4), 0 6px 20px rgba(204,100,136,0.06); }
  /* phone-only cute chrome — hidden on desktop, which keeps the plain framed board */
  .wall-banner, .wall-banner-hearts, .wall-curtain-deco, .wall-ears, .ws-heart, .wall-safebot, .wall-pinframe { display: none; }
  .wall-sheet { display: contents; }   /* desktop: transparent to layout; phone turns it into the framed sheet */

  /* ---------- THE CURTAIN (phone only; switched on in the phone media query) ----------
     These rules sit outside that query only so the ~30KB heart tile exists once in the file — the
     display:none above keeps the whole curtain off desktop, which deliberately stays the plain
     framed board. --bh is the curtain's depth; the phone query raises it to clear the notch. */
    /* THE CURTAIN, scalloped edge included — ONE element, so the bumps are cut out of the very same
       gradient as the curtain above them and therefore match it everywhere, including across the
       top-left sheen. (They used to be a separate element filled with flat #ffd8e6: fine while the
       curtain was flat, but the moment it gained a gradient the bumps stopped matching it.)
       The box is --bh + 16px tall and the mask has two layers, composited by union:
         1. an opaque block over the top --bh — the curtain proper;
         2. the scallop semicircles tiled across the last 16px — the bumps.
       A minor gradient for depth: soft light from the top-left over a three-stop vertical base. */
  .wall .wall-banner { position: absolute; top: 0; left: 0; right: 0;
      height: calc(var(--bh) + 16px); z-index: 6;
      background-image:
        linear-gradient(107deg, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0.08) 34%, rgba(255,255,255,0) 62%),
        linear-gradient(180deg, #ffeaf2 0%, #ffe3ed 52%, #ffd8e6 100%);
      -webkit-mask-image: linear-gradient(#000, #000),
        radial-gradient(circle 11px at 11px 0, #000 10.4px, rgba(0,0,0,0) 10.9px);
      -webkit-mask-size: 100% var(--bh), 22px 16px;
      -webkit-mask-position: 0 0, 0 var(--bh);
      -webkit-mask-repeat: no-repeat, repeat-x;
      mask-image: linear-gradient(#000, #000),
        radial-gradient(circle 11px at 11px 0, #000 10.4px, rgba(0,0,0,0) 10.9px);
      mask-size: 100% var(--bh), 22px 16px;
      mask-position: 0 0, 0 var(--bh);
      mask-repeat: no-repeat, repeat-x; }
    /* The layer is 300px OVERSIZE on each side and drifts by exactly one tile period, so the flood glides
       sideways forever with nothing ever entering or leaving frame. translate3d (not background-position)
       keeps it on the compositor — a background-position animation repaints the curtain every frame.
       It tiles on BOTH axes now: the curtain is --bh+16 tall but the tile is 58, so vertical centring used
       to leave a heart-free strip top and bottom — the "padding". Hearts crossing a tile edge are emitted
       one tile up/down as well, so the vertical repeat has no seam either. */
  .wall .wall-banner-hearts { position: absolute; top: 0; bottom: 0;
      left: -300px; right: -300px; z-index: 0; pointer-events: none;
      --heart-op: 0.5; opacity: var(--heart-op);
      animation: curtainDrift 90s linear infinite; will-change: transform;
      /* and a gradient across the flood itself: fullest at the top, easing off toward the scallop, so the
         hearts settle into the curtain instead of stopping abruptly at its lower edge */
      -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 46%, rgba(0,0,0,0.55) 82%, rgba(0,0,0,0.3) 100%);
      mask-image: linear-gradient(180deg, #000 0%, #000 46%, rgba(0,0,0,0.55) 82%, rgba(0,0,0,0.3) 100%); }
    /* ୨♡୧ flourish sits on the curtain, centred just under the island */
  /* The flourish is centred by ANCHORING THE ♡, not by text-align. text-align centres the line BOX; the
     ink inside it only lands on centre if the glyphs are symmetric — and ⋆ ˚ ୨ ୧ come from different
     fallback fonts on iOS than on desktop, with different advance widths, so the box can be centred while
     the flourish visibly is not. (Measured dead-centre in Chrome, off-centre on the phone: that mismatch
     IS the font metrics.) Now the heart sits in a fixed-width box pinned to 50%, and the two flanks are
     pinned to the same 50% and pushed out equally, so the ♡ is exactly on the centre line whatever the
     glyph widths do. The left flank's margin is 3px tighter to cancel the trailing letter-space that
     letter-spacing adds after its last character. */
  .wall .wall-curtain-deco { position: absolute; top: calc(var(--bh) - 12px); left: 0; right: 0; z-index: 8;
      height: 15px; font-size: 12px; color: #c17a97; }
  .wall .wcd-h { position: absolute; left: 50%; width: 16px; margin-left: -8px; text-align: center; }
  .wall .wcd-l { position: absolute; right: 50%; margin-right: 5px; white-space: nowrap; letter-spacing: 3px; }
  .wall .wcd-r { position: absolute; left: 50%; margin-left: 8px; white-space: nowrap; letter-spacing: 3px; }
  /* how long we've been us, tucked into the end of the curtain's line — a whisper, not a headline.
     Right-aligned rather than centred so it can never fight the ♡ for the middle of the curtain. */
  .wall .wcd-since {
    /* top is relative to the flourish's row, so a negative value lifts it up the curtain — it sits higher
       than the ♡ line, on the flat pink well clear of the scallops, and still below the status bar. */
    position: absolute; right: 21px; top: -4px; white-space: nowrap;
    font-family: "Bradley Hand","Segoe Print",cursive; font-size: 8px; letter-spacing: 0.2px;
    color: rgba(176,104,134,0.6);
  }
  /* on the 16th it is allowed to be noticed — but only just */
  .wall .wcd-since.today { color: rgba(198,74,116,0.92); font-size: 9px; animation: sinceGlow 2.6s ease-in-out infinite; }

  /* PHONE VIEW (exclusive): scalloped pink banner + ears round the Dynamic Island + a scalloped,
     dashed frame. The banner/ears/frame are pinned; the header + notes scroll underneath them.
     Rules scoped under .wall so they out-specify the base .wall-* rules later in this stylesheet. */
  /* IS THIS A PHONE?
     Width alone was the test, and a big phone reporting more than the cutoff got the DESKTOP board: no curtain,
     the spelled-out "9 months together" heading, notes placed by percentage — which is exactly what an
     iPhone 17 Pro Max was showing. A touch screen with no mouse is a phone whatever width it claims, so it
     is asked directly now, with width kept as the answer for a narrow window on a desktop.
     ⚠ The JS copy of this test (isPhone) MUST stay identical: the phone layout positions notes in pixels,
     so if the two ever disagree the board falls apart. */
  @media (max-width: 750px), (hover: none) and (pointer: coarse) and (max-width: 1024px) {
    html, body { height: 100vh; overflow: hidden; overscroll-behavior: none; }   /* 100vh — see the chin-gap note up top */
    /* The WALL paints its own checkered pattern (see the base .wall rule) — it must, because the
       bloom→board heart reveal masks this element: the pattern has to travel with the mask so the heart
       opens onto a real board. Painting it on the root instead would leave the revealed heart pattern-less
       until the reveal finished. html.rt-board is a flat backstop for the same cream, nothing more. */
    .wall.show {
      display: block; position: fixed; inset: 0;
      height: auto; overflow: hidden; padding: 0;   /* let inset:0 span to the true screen bottom */
      --bh: max(58px, env(safe-area-inset-top), var(--sat, 0px));   /* banner height clears the notch */
      /* how far the frame's closing edge sits above the screen bottom: tucked in so the frame follows the
         phone's outline, but clear of the home-indicator pill (~8-13px up). Used by BOTH the pinned side
         lines and the sheet's closing edge, so the two always meet exactly. */
      --sbot: max(10px, calc(max(env(safe-area-inset-bottom), var(--sab, 0px)) - 20px));
    }
    .wall .wall-frame { display: none; }
    /* the curtain is phone-only (desktop stays the plain framed board) */
    .wall .wall-banner, .wall .wall-banner-hearts, .wall .wall-curtain-deco { display: block; }
    .wall .wall-head .wall-deco { display: none; }   /* the curtain carries it here; don't repeat it */
    .wall .wall-head .wall-since { display: none; }  /* likewise — it rides on the curtain on a phone */
    .wall .wall-safebot { display: none; }   /* the document reaches the bottom edge now; nothing to patch */

    /* THE FRAME — ONE pinned element drawing the sides AND the closing edge as a single border, so the
       corners are genuinely joined and the dash pattern runs continuously round it. Two separate pieces
       (scrolling side borders + a scrolling bottom border) never lined up: different dash phases, a seam
       at each corner, and both slid about as the board scrolled.
       z:5 sits ABOVE the notes (z:4) so the closing edge stays fully visible as notes scroll past it —
       otherwise the line vanishes behind a card, which is the inconsistency being fixed — and BELOW the
       curtain (z:6) so the sides slip behind it at the top rather than crossing it.
       Pinned, so nothing here can move however hard the board is scrolled or overscrolled. */
    .wall .wall-pinframe {
      display: block; position: absolute; z-index: 5; pointer-events: none;
      top: 0; left: 8px; right: 8px; bottom: var(--sbot);
      border: 2px dotted rgba(222,150,180,0.6); border-top: none;
      /* iPhone screen corners are ~55px; less the 8px side inset, ~44px sits concentric with them, so the
         corner curves parallel to the glass instead of cutting across it. */
      border-radius: 0 0 44px 44px;
    }
    /* ♡ corners ride on the frame itself, so they stay with the closing edge */
    .wall .ws-heart { display: block; position: absolute; bottom: 13px; font-size: 14px; color: rgba(226,150,180,0.75); }
    .wall .ws-hl { left: 20px; } .wall .ws-hr { right: 20px; }

    /* pink scalloped banner across the very top */
    /* HAND-DRAWN hearts on the curtain — an open stroked path with a sweeping tail, never a glyph or
       emoji. Three sizes and leans per tile so it reads as scattered doodles rather than wallpaper; the
       stroke widths are pre-divided by each group's scale so all three keep the same ~2.3px line weight.
       --heart-op is the ONE knob for how faint they are (lower = fainter). It lives here rather than in
       the svg's alphas because a percent-encoded data URI is no place to tune a value by hand.
       Five shapes (sweeping tail, twin-stroke, tight, lopsided, tiny), 20 per 300px tile in mixed sizes
       and leans, several clipped by the band edges so the flood reads continuous rather than lined up.
       Every heart is also emitted at x-300 and x+300, so whatever a tile clips at one edge reappears at
       the other: measured max 0.70/255 difference across one period, i.e. seamless. */

    /* cat-ears flanking the Dynamic Island */
    .wall .wall-ears { display: block; }
    /* Ears — four knobs on .wall-ear:
         --ear-x  distance of each ear's base from the screen centre (smaller = further in)
         --ear-s  size (scaled by TRANSFORM: the artwork is an SVG, so this never distorts it)
         --ear-y  vertical nudge; negative tucks the tips above the top edge so they only peek
         --ear-a  outward lean. transform-origin is the ear's BASE, so raising this swings the tip
                  away from the island while the base stays planted on it — angled out, not shifted out.
       Each ear is ONE svg holding both the black outline and the pink inner, and BOTH ears use the
       identical markup — the right one is simply mirrored with scaleX(-1). Previously each ear had its
       own hand-drawn outer path AND its own hand-drawn pink path, four independent shapes that were
       never true mirrors: the two ears leaned differently and the pink sat at a different height and
       size on each side. One shape + a mirror makes them even by construction.
       The pink is the SAME path as the black, scaled to 0.55 about the ear's base — so it is exactly
       concentric with the outline, which is what makes it read as the inside of the ear rather than a
       blob laid on top. */
    .wall .wall-ears { display: block; }
    .wall .wall-ear { position: absolute; top: var(--ear-y); left: 50%; z-index: 7;
      width: 34px; height: 36px; transform-origin: bottom center;
      --ear-x: 49px; --ear-s: 0.8; --ear-y: -12px; --ear-a: 22deg; }
    .wall .ear-l { margin-left: calc(-1 * var(--ear-x) - 17px);
      transform: rotate(calc(-1 * var(--ear-a))) scale(var(--ear-s)); }
    .wall .ear-r { margin-left: calc(var(--ear-x) - 17px);
      transform: scaleX(-1) rotate(calc(-1 * var(--ear-a))) scale(var(--ear-s)); }   /* mirror of the left */
    .wall .wall-ear svg { display: block; width: 100%; height: 100%; overflow: visible; }

    /* The scroller ends exactly at the frame's inner edge (--sbot + the 2px border), so notes are clipped
       BY the frame instead of sliding across it — the frame is a window, and nothing is ever drawn on the
       far side of its closing edge.
       Historical note so this is not "fixed" again in the wrong direction: an inset here was once blamed
       for a pale bar under the notes. It was not the cause — the iOS chin gap was (html/body height:100%,
       see the note at the top of this stylesheet). With the document now spanning the full viewport, the
       strip below this edge is the frame's own margin, matching the 8px at the sides. */
    .wall .wall-inner {
      position: absolute; width: auto; margin: 0; flex: none; border: none; box-shadow: none;
      top: var(--bh); left: 0; right: 0; bottom: calc(var(--sbot) + 2px);
      display: block; border-radius: 0; z-index: 4; padding: 0;
      overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
      touch-action: pan-y;   /* scroll only — no pinch zoom on the board */
    }
    .wall .wall-sheet {
      /* the sheet draws NO frame — .wall-pinframe owns all of it. This is purely the scrolling content
         column; the bottom padding stops the last note butting into the closing edge at the scroll end. */
      display: block; position: relative; min-height: 100%;
      margin: 0 8px; padding: 10px 14px 16px;
      border: none; border-radius: 0;
    }
    .wall .wall-head { margin-bottom: 14px; }
    .wall .wall-notes { flex: none; }
    .wall .wall-floaters, .wall .wall-corner { display: none; }
    .wall .wall-place { position: fixed; }
    /* pinned just under the curtain on the left, mirroring the counter stamp on its right */
    .wall .wall-rail { left: 13px; right: auto; top: calc(var(--bh) + 8px); z-index: 9; }
    .wall .wall-add {
      position: fixed; top: auto; left: auto;
      right: 26px; bottom: calc(40px + max(env(safe-area-inset-bottom), var(--sab, 0px)));
      width: 58px; height: 58px; z-index: 10;
    }
  }
  .wall-floaters { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .wall-floaters span { position: absolute; }
  .wall-corner { position: absolute; z-index: 3; pointer-events: none; font-size: 14px; color: rgba(226,150,180,0.75); }

  /* ---------- the little rail of drawn icons, top-left ----------
     Hand-drawn SVG rather than emoji, so they sit in the same ink as everything else and can't change
     shape under us when a platform updates its emoji font. Room for more than one: the calendar is first,
     with the reaction face and the jar to come. */
  /* a row, not a column: side by side reads as one little set of tools rather than a stack */
  .wall-rail { position: absolute; z-index: 9; display: flex; flex-direction: row; align-items: center; gap: 6px; }
  .wall-icon {
    /* just the drawing — no chip, no border, no shadow. The 40px box stays for the thumb; only the ink
       inside it is visible. A soft white halo keeps the line readable when a note scrolls under it. */
    position: relative; width: 40px; height: 40px; padding: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; box-shadow: none;
    color: rgba(190,116,146,0.92);
    filter: drop-shadow(0 0 2px rgba(255,255,255,0.95)) drop-shadow(0 1px 1px rgba(255,255,255,0.8));
    transition: transform 0.14s ease, color 0.14s ease;
  }
  .wall-icon:hover { color: #cc6488; transform: scale(1.08); }
  .wall-icon:active { transform: scale(0.92); }
  .wall-icon svg { display: block; width: 24px; height: 24px; }
  /* a filter is on: the ink deepens and a small bead appears, since there is no chip left to fill in */
  .wall-icon.on { color: #d1567f; }
  .wall-icon.on::after {
    content: ""; position: absolute; top: 5px; right: 3px; width: 5px; height: 5px; border-radius: 50%;
    background: #e8709a; box-shadow: 0 0 0 1.5px rgba(255,255,255,0.9);
  }

  /* ---------- the month picker ---------- */
  .cal-card {
    width: min(88vw, 330px); background: #fffdf8; border-radius: 22px; padding: 20px 18px 16px;
    border: 1.5px dashed rgba(228,168,190,0.6);
    box-shadow: 0 26px 60px rgba(80,50,60,0.36); cursor: default; text-align: center;
    animation: notePopBig 0.34s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .cal-title { font-family: "Snell Roundhand","Segoe Script",cursive; font-size: 27px; color: #cc6488; margin-bottom: 2px; }
  .cal-sub { font-family: "Bradley Hand","Segoe Print",cursive; font-size: 12px; color: #b08b99; margin-bottom: 12px; }
  .cal-year { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 12px; }
  .cal-year span { font-family: "Bradley Hand","Segoe Print",cursive; font-size: 17px; color: #a05a72; min-width: 54px; }
  .cal-arrow {
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer; padding: 0;
    border: 1.5px solid rgba(216,105,138,0.3); background: #fff; color: #c07d95; font: 15px/1 system-ui, sans-serif;
  }
  .cal-arrow[disabled] { opacity: 0.3; cursor: default; }
  .cal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .cal-m {
    position: relative; padding: 9px 2px 7px; border-radius: 13px; cursor: pointer;
    border: 1.5px solid rgba(216,105,138,0.26); background: #fff;
    font-family: "Bradley Hand","Segoe Print",cursive; font-size: 14px; color: #8a5462;
  }
  .cal-m .n {   /* a little count bead */
    display: block; margin-top: 2px; font-size: 10px; color: #c08fa2;
  }
  .cal-m .n.lt { color: #b4849a; }   /* the letter count, a shade quieter than the notes */
  /* a month holding something gets a warmer edge, so which months exist reads at a glance rather than
     having to read every count */
  .cal-m:not(.empty) { border-color: rgba(216,105,138,0.48); background: #fff8fb; }
  .cal-m.empty { opacity: 0.42; }
  .cal-m.sel { background: linear-gradient(135deg, #ffd9e6, #ffc2d6); border-color: #e290ad; color: #8c3f5c; }
  .cal-m.sel .n { color: #a84c6c; }
  .cal-m.now::after {   /* a dot marking the month we are actually in */
    content: ""; position: absolute; top: 5px; right: 6px; width: 5px; height: 5px; border-radius: 50%;
    background: #e8709a;
  }
  .cal-all {
    width: 100%; margin-top: 12px; padding: 10px; border-radius: 13px; cursor: pointer;
    border: 1.5px solid rgba(216,105,138,0.3); background: #fff; color: #a05a72;
    font-family: "Bradley Hand","Segoe Print",cursive; font-size: 14px;
  }
  .cal-all.sel { background: linear-gradient(135deg, #ffd9e6, #ffc2d6); border-color: #e290ad; color: #8c3f5c; }
  .cal-close { margin-top: 8px; border: none; background: none; cursor: pointer; font-family: "Bradley Hand","Segoe Print",cursive; font-size: 12px; color: #b892a1; }
  /* nothing in this month yet */
  .wall-empty {
    position: absolute; left: 0; right: 0; top: 34px; text-align: center; padding: 0 26px;
    font-family: "Bradley Hand","Segoe Print",cursive; font-size: 14px; line-height: 1.6; color: #b08b99;
  }
  .wall-empty b { display: block; font-family: "Snell Roundhand","Segoe Script",cursive; font-size: 25px; color: #cc6488; font-weight: 400; margin-bottom: 4px; }

  /* desktop: the rail hangs under the ✚, so both controls live in the same corner. 40px from the right
     puts the 40px icon's centre on the ✚'s centre (which sits 60px in: 34px offset + half of 52px). */
  .wall-rail { right: 40px; top: 96px; }
  .wall-inner { position: relative; z-index: 1; width: 100%; flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 6px 6px 0; }
  .wall-head { text-align: center; margin-bottom: 12px; flex: 0 0 auto; }
  .wall-deco { font-size: 12px; letter-spacing: 3px; color: #d3a3b6; }
  .wall-title { font-family: "Snell Roundhand","Segoe Script","Brush Script MT",cursive; font-size: 34px; color: #cc6488; line-height: 1.25; }
  .wall-count { font-family: "Bradley Hand","Segoe Print",cursive; font-size: 13px; color: #ab7c8f; }
  /* how long we've been us. On the 16th it says "today" instead of counting, and glows a little. */
  .wall-since { margin-top: 3px; font-family: "Snell Roundhand","Segoe Script",cursive; font-size: 17px; color: #c0879b; }
  .wall-since.today {
    color: #d1567f; font-size: 20px;
    text-shadow: 0 0 10px rgba(255,190,215,0.9), 0 0 22px rgba(255,170,200,0.55);
    animation: sinceGlow 2.6s ease-in-out infinite;
  }
  @keyframes sinceGlow { 0%,100% { opacity: 0.86; transform: scale(1); } 50% { opacity: 1; transform: scale(1.035); } }
  .wall-notes { position: relative; width: 100%; flex: 1 1 auto; min-height: 0; }
  /* phone: the whole board scrolls (see the max-width media query); let a touch over a note scroll it too */
  .wall-notes.stack .wnote { touch-action: pan-y; }
  .wnote { position: absolute; cursor: pointer; touch-action: none; }
  .wnote.movable { cursor: grab; }
  .wnote-card { transition: box-shadow 0.25s ease; }
  .wnote-card:hover { box-shadow: 0 12px 22px rgba(170,135,145,0.3), inset 0 -10px 16px rgba(0,0,0,0.028) !important; }
  /* tap-to-expand modal */
  .wall-modal {
    position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center; padding: 24px; cursor: pointer;
    background: rgba(120,80,95,0.28); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  }
  .wall-modal.open { display: flex; }
  .wm-stage { display: flex; align-items: flex-start; gap: 16px; }
  .wm-note-box { position: relative; }
  .wm-note { position: absolute; left: 50%; top: 50%; transform-origin: center; animation: fadeIn 0.3s ease both; }
  .wm-stage { animation: notePopBig 0.4s cubic-bezier(0.34,1.56,0.64,1) both; }
  .wm-tools { display: flex; flex-direction: column; gap: 10px; }
  .wm-tool {
    width: 46px; height: 46px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,0.94); box-shadow: 0 6px 16px rgba(150,90,110,0.28);
    font-size: 18px; color: #a05a72; display: flex; align-items: center; justify-content: center;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .wm-tool:hover { background: #ffe1ec; transform: scale(1.08); }
  .wall-modal-card {
    width: min(90vw, 430px); min-height: 230px; padding: 42px 32px 30px;
    display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: 0 30px 70px rgba(80,50,60,0.4);
    animation: notePopBig 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes notePopBig { 0% { opacity: 0; transform: scale(0.6) rotate(-4deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }

  /* + button (top-right of the wall) */
  .wall-add {
    position: absolute; top: max(30px, env(safe-area-inset-top)); right: 34px; z-index: 8;
    width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, system-ui, sans-serif; font-weight: 300; font-size: 32px;
    line-height: 1; padding: 0; color: #fff;
    background: linear-gradient(135deg, #ffa6c9, #d8698a);
    box-shadow: 0 8px 18px rgba(216,105,138,0.4);
    transition: transform 0.14s ease, box-shadow 0.14s ease;
  }
  .wall-add span { display: block; margin-top: -2px; }
  .wall-add:hover { transform: scale(1.08) rotate(90deg); box-shadow: 0 10px 22px rgba(216,105,138,0.5); }
  .wall-add:active { transform: scale(0.94); }
  /* confirm-placement pill, shown while a note is movable */
  .wall-place {
    position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%);
    z-index: 15; display: none; border: none; cursor: pointer;
    padding: 12px 26px; border-radius: 999px; color: #fff;
    font: 600 15px "Bradley Hand", "Segoe Print", cursive;
    background: linear-gradient(135deg, #ffa6c9, #d8698a);
    box-shadow: 0 8px 22px rgba(216,105,138,0.45);
  }
  .wall-place.show { display: block; animation: placePop 0.3s cubic-bezier(0.34,1.56,0.64,1) both; }
  @keyframes placePop { 0% { opacity: 0; transform: translateX(-50%) translateY(10px) scale(0.9); } 100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); } }

  /* ---------- add-a-note creator screen ---------- */
  .add, .draw {
    position: fixed; inset: 0; z-index: 7; display: none; overflow-y: auto;
    touch-action: pan-y;   /* scroll only — no pinch zoom while writing a note */
    /* Clear the notch at the top and the home indicator at the bottom. 26px alone put the back arrow and
       the title right up against the Dynamic Island — the safe-area inset is ~59px on these phones, and
       env() is 0 on a desktop so this is the same 26px there. */
    /* --kb is however much of the screen the keyboard is covering (see the visualViewport block in the
       script). iOS does NOT shrink the page when the keyboard opens, so without this everything below the
       field you're typing in — the word count, "from", the send button — sits underneath it, unreachable. */
    padding: calc(26px + max(env(safe-area-inset-top), var(--sat, 0px))) 18px
             calc(70px + max(env(safe-area-inset-bottom), var(--sab, 0px)) + var(--kb, 0px));
    color: #74505c;
    background-color: #fffaf1;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,240,190,0.34), transparent 48%),
      radial-gradient(circle at 84% 34%, rgba(255,214,228,0.30), transparent 48%),
      repeating-linear-gradient(90deg, rgba(244,150,178,0.05) 0 30px, transparent 30px 60px),
      repeating-linear-gradient(0deg, rgba(244,150,178,0.05) 0 30px, transparent 30px 60px);
  }
  .add.show, .draw.show { display: block; }
  .draw-stage { display: flex; justify-content: center; margin: 4px 0 18px; }
  .draw-card { position: relative; overflow: hidden; box-shadow: 0 12px 28px rgba(170,135,145,0.3); }
  .draw-tools { max-width: 360px; margin: 0 auto; }
  .draw-open {
    display: block; width: 100%; margin: 0 0 6px; cursor: pointer;
    border: 1.5px dashed rgba(216,105,138,0.4); background: rgba(255,255,255,0.7); color: #b8446a;
    border-radius: 12px; padding: 10px; font: 600 14px "Bradley Hand","Segoe Print",cursive;
  }
  .draw-open:hover { background: #fff3f7; }
  .draw-hex { width: 32px; height: 32px; border: none; border-radius: 9px; padding: 0; cursor: pointer; background: none; box-shadow: 0 0 0 1.5px rgba(216,105,138,0.3); }
  .draw-hex::-webkit-color-swatch-wrapper { padding: 0; }
  .draw-hex::-webkit-color-swatch { border: none; border-radius: 8px; }
  .draw-hex::-moz-color-swatch { border: none; border-radius: 8px; }
  .draw-size-row { display: flex; align-items: center; gap: 14px; padding: 6px 4px; }
  .draw-size-row input[type=range] { flex: 1; accent-color: #d8698a; height: 6px; }
  .draw-size-dot { flex: 0 0 auto; border-radius: 50%; box-shadow: 0 1px 3px rgba(120,80,95,0.3); transition: width 0.1s, height 0.1s; }

  .add-inner {
    position: relative;
    max-width: 940px; margin: 18px auto;
    background: rgba(255,253,250,0.94);
    border: 1.5px dashed rgba(228,168,190,0.55);
    border-radius: 24px;
    padding: 22px 26px 26px;
    box-shadow: 0 22px 55px rgba(200,120,150,0.22);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  .add-back {
    position: absolute; top: 16px; left: 18px; z-index: 2;
    width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
    border: 1.5px solid rgba(204,100,136,0.3); background: rgba(255,255,255,0.6);
    color: #c07d95; font: 18px/1 -apple-system, system-ui, sans-serif;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .add-back:hover { background: #ffe1ec; color: #b8446a; }
  .add-title { font-family: "Snell Roundhand","Segoe Script",cursive; font-size: 32px; color: #cc6488; text-align: center; margin: 2px 0 16px; }
  .add-hint { text-align: center; font: 13px "Bradley Hand","Segoe Print",cursive; color: #b98aa0; margin-bottom: 16px; }

  /* ---------- the little pinned preview ----------
     The options list is long, so once the big note has scrolled away this taped-up miniature takes over:
     you keep seeing what you're making while you change it. It's a REAL note (same noteInner markup, just
     scaled), never a redrawn approximation, so it can't drift from the real thing.
     It lives as a direct child of .add, not inside .add-inner — .add-inner has a backdrop-filter, and that
     makes it the containing block for fixed children, which would pin this to the card instead of the screen. */
  .add-mini {
    position: fixed; z-index: 12; cursor: pointer;
    top: calc(12px + max(env(safe-area-inset-top), var(--sat, 0px))); right: 13px;
    width: 138px; padding: 10px 10px 6px; border-radius: 17px;
    background: rgba(255,253,250,0.97);
    border: 1.5px dashed rgba(228,168,190,0.8);
    box-shadow: 0 12px 26px rgba(200,120,150,0.28);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    /* hidden state: tucked up and small, so it drops in rather than blinking */
    opacity: 0; transform: rotate(-3deg) translateY(-10px) scale(0.82); pointer-events: none;
    transition: opacity 0.2s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .add-mini.show { opacity: 1; transform: rotate(-3deg) translateY(0) scale(1); pointer-events: auto; }
  .add-mini:active { transform: rotate(-3deg) scale(0.95); }
  /* a scrap of washi tape holding it to the screen */
  .am-tape {
    position: absolute; top: -8px; left: 50%; margin-left: -19px; width: 38px; height: 15px; border-radius: 2px;
    transform: rotate(-5deg); background: repeating-linear-gradient(45deg, rgba(255,255,255,0.8) 0 4px, rgba(255,205,222,0.95) 4px 8px);
    box-shadow: 0 1px 3px rgba(170,120,140,0.28);
  }
  /* the window is a few px taller than the note is wide, because the tape/pin decoration sits ABOVE the
     card (top:-9k in noteDecoHTML) — without the headroom the miniature's own tape would be clipped off. */
  .am-window { position: relative; width: 118px; height: 127px; overflow: hidden; margin: 0 auto; }
  .am-shrink { position: absolute; top: 9px; left: 0; width: 300px; height: 300px; transform-origin: top left; }
  .am-cap { display: block; text-align: center; margin-top: 3px; letter-spacing: 0.6px;
    font: 10px "Bradley Hand","Segoe Print",cursive; color: #c08fa2; }
  @media (max-width: 750px), (hover: none) and (pointer: coarse) and (max-width: 1024px) {
    .add-mini { width: 122px; } .am-window { width: 102px; height: 110px; } }
  .add-row { margin: 13px 0; }
  .add-label { font-family: "Bradley Hand","Segoe Print",cursive; font-size: 15px; color: #b07890; margin-bottom: 7px; letter-spacing: 0.4px; }
  .add-opts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .opt {
    border: 1.5px solid rgba(216,105,138,0.28); background: #fff; border-radius: 12px;
    padding: 8px 13px; font: 600 13px "Bradley Hand","Segoe Print",cursive; color: #8a5462; cursor: pointer;
    transition: background 0.14s ease, border-color 0.14s ease;
  }
  .opt:hover { background: #fff3f7; }
  .opt.sel { border-color: #d8698a; background: #ffe1ec; color: #b8446a; }
  .opt-swatch {
    width: 32px; height: 32px; border-radius: 9px; cursor: pointer;
    box-shadow: 0 0 0 1.5px rgba(216,105,138,0.3); transition: box-shadow 0.14s ease, transform 0.14s ease;
  }
  .opt-swatch:hover { transform: scale(1.06); }
  .opt-swatch.sel { box-shadow: 0 0 0 3px #d8698a; }
  .add-msg {
    width: 100%; box-sizing: border-box; border: 1.5px solid rgba(216,105,138,0.28); border-radius: 14px;
    padding: 11px 13px; font: 16px "Bradley Hand","Segoe Print",cursive; color: #6a4a54;
    min-height: 84px; resize: vertical; background-color: #fffdfc; outline: none; display: block;
    white-space: pre-wrap; overflow-wrap: anywhere;   /* the note's <p> uses exactly these */
    /* the note's paper (lined, checked, hearts) is a background, and a textarea's background is pinned to
       the BOX while the words scroll inside it — so it has to be local here too, or writing past the bottom
       slides the paper out from under the text. See the same note on .lt-write. */
    background-attachment: local;
  }
  .add-msg:focus { border-color: #ff9dc2; }
  /* currentColor = the note's ink, which styleWriteField() sets */
  .add-msg::placeholder { color: currentColor; opacity: 0.42; }
  .add-msg::-webkit-input-placeholder { color: currentColor; opacity: 0.42; }
  /* A screen wearing the board's top ornament: same rules, none of the board. */
  /* The shared ornament sits ABOVE the screens (the board is z6, the letters/creator z7) so the curtain
     covers what scrolls under it, and BELOW the modals (z20) so a picker still opens over it. It paints no
     background of its own and takes no taps. */
  .wall .wbh-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .chrome-only {
    background: none !important; pointer-events: none; z-index: 8;
    height: 100vh;
  }
  .chrome-only * { pointer-events: none; }
  /* the "hidden" curtain — see warmChrome(). Painted, just not visibly. */
  .chrome-only.chrome-hide { opacity: 0.004; }

  /* ---------- letters ----------
     A letter has to READ like a letter: a generous measure, real paragraph spacing, handwriting rather
     than UI type, and no length limit anywhere in the chain. The stack lists them; sealed ones say only
     that they exist and who they're for. */
  .letters .add-inner { max-width: 620px; }
  /* the header sits on one line — arrow, then the name, the way your mock has it — instead of a centred
     title with the arrow floating over it */
  .lt-top { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .letters .lt-top .add-back { position: static; flex: 0 0 auto; }
  .lt-toptitle { font-family: "Parisienne", cursive; font-size: 32px; color: #cc6488; line-height: 1.2; }
  .lt-sub { margin: 0 0 18px; text-align: center; font-family: "Caveat", cursive; font-weight: 500;
    font-size: 17px; color: #b98da0; }

  /* THE INBOX — your mock, wired to the real letters. Every row is a little ENVELOPE: the paper the writer
     chose, a quiet flap line across the top, a washi-tape stamp on the right in that letter's tape, and a
     drop of red wax only while it is still sealed. It carries the header only — title, who it went from and
     to, the date. Never a line of what's inside; that is the letter's to tell. */
  .lt-stack { display: flex; flex-direction: column; gap: 15px; }
  .lt-row {
    position: relative; display: block; width: 100%; height: 78px; padding: 0; cursor: pointer;
    text-align: left; overflow: hidden; border-radius: 9px;
    border: 1px solid var(--lce, #f7dbe6);
    background: var(--lc, linear-gradient(168deg,#fffdf3,#fff6e2));
    box-shadow: 0 4px 11px rgba(190,140,155,0.14);
    transition: transform 0.22s ease, box-shadow 0.22s ease;
  }
  /* the pile leans: alternating, so no two neighbours line up. The hover lift has to repeat the rotation —
     a bare translateY would replace it and snap the row straight. */
  .lt-row:nth-child(odd)  { transform: rotate(-0.5deg); }
  .lt-row:nth-child(even) { transform: rotate(0.4deg); }
  .lt-row:nth-child(odd):hover  { transform: rotate(-0.5deg) translateY(-3px); }
  .lt-row:nth-child(even):hover { transform: rotate(0.4deg) translateY(-3px); }
  .lt-row:hover { box-shadow: 0 10px 20px rgba(190,130,155,0.24); }
  /* the flap: one quiet line across the top, not a filled triangle */
  .lt-r-flap {
    position: absolute; top: 0; left: 0; right: 0; height: 34px;
    border-bottom: 1px solid rgba(232,160,188,0.3);
    -webkit-clip-path: polygon(0 0, 100% 0, 50% 100%); clip-path: polygon(0 0, 100% 0, 50% 100%);
    background: rgba(255,224,236,0.4);
  }
  /* the stamp, in the letter's own tape — with its sticker on it if it was given one */
  .lt-r-stamp {
    position: absolute; top: 50%; right: 14px; margin-top: -21px; width: 42px; height: 42px; z-index: 3;
    display: flex; align-items: center; justify-content: center; font-size: 15px; color: #c9527d;
    background: repeating-linear-gradient(135deg, var(--lsa, rgba(255,255,255,0.92)) 0 7px, var(--lsb, rgba(255,206,222,0.9)) 7px 14px);
    border: 2.5px solid #fffdf6; border-radius: 2px; transform: rotate(4deg);
    box-shadow: 0 2px 6px rgba(190,140,155,0.28);
  }
  .lt-r-stamp svg { width: 26px; height: 26px; display: block; }
  /* SEALED: a drop of wax, and the title in the darker ink. Nothing else says it — no badge, no words. */
  .lt-r-seal {
    position: absolute; top: 12px; right: 62px; width: 12px; height: 12px; z-index: 4; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #f2799e, #cf4a74 72%);
    box-shadow: 0 2px 6px rgba(190,80,120,0.45);
  }
  .lt-r-slip {
    position: absolute; left: 18px; right: 72px; top: 50%; z-index: 2; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 2px;
  }
  .lt-r-title { font-family: "Gochi Hand", cursive; font-size: 20px; line-height: 1.25; color: #a9647f;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lt-row.sealed .lt-r-title { color: #c9527d; }
  .lt-r-meta { font-family: "Gochi Hand", cursive; font-size: 13px; color: #a3768a;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lt-r-meta i { font-style: normal; color: #d5a3b6; padding: 0 2px; }

  /* ---------- the letter itself ----------
     Your template: ruled paper on a slight tilt, folded corners, washi tape top and bottom, a Parisienne
     heading over a dashed ♡ divider, the greeting in Gochi, the body in Caveat, and a signed dashed line
     at the end. The rules are lines of the paper, not decoration — the body's 28px line-height is the same
     28px the ruling repeats on, so the writing sits ON the lines. */
  @keyframes letterIn {
    0%   { transform: scale(0.94) translateY(14px) rotate(-0.6deg); opacity: 0; }
    100% { transform: scale(1) translateY(0) rotate(-0.5deg); opacity: 1; }
  }
  /* The sheet paints through a pseudo-element rather than its own background, because the corner has to be
     CUT AWAY for the fold to be a fold — and a clip-path on .lt-letter itself would take the washi tape
     (which deliberately hangs outside the box) with it. drop-shadow, not box-shadow: a box-shadow is part of
     the element's own painting and gets clipped by the same path, which would leave the sheet with no shadow
     at all. A filter follows the clipped shape, so the shadow turns the corner with it. */
  /* .add-inner brings a card of its own — background, dashed border, 24px radius, shadow. All of it has to
     go, or its square-ish corner paints under the flap and the fold has nothing to cut. */
  .letters .lt-letter { position: relative; padding: 10px 20px 24px;
    border: none; background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none;
    transform: rotate(-0.5deg);
    animation: letterIn 0.6s cubic-bezier(0.34,1.4,0.64,1) both;
    --fold: 34px;
  }
  .lt-letter::before {
    content: ""; position: absolute; inset: 0; z-index: -1;   /* -1: under the text, over nothing else */
    background-color: var(--lp, #fffdf6); border-radius: 4px;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - var(--fold)), calc(100% - var(--fold)) 100%, 0 100%);
    filter: drop-shadow(0 10px 16px rgba(190,130,150,0.22)) drop-shadow(0 2px 4px rgba(190,130,150,0.16));
  }
  /* ONE folded corner, bottom right — the cut-away triangle turned up onto the front of the sheet. It is the
     MIRROR of the missing piece (135deg fills the half toward the top-left), it is a shade darker because
     you are looking at the back of the paper, and it casts a shadow up-left along the crease so the paper
     reads as lifted rather than as a triangle someone drew on it. */
  .lt-fold-br { position: absolute; bottom: 0; right: 0; width: var(--fold); height: var(--fold);
    background:
      linear-gradient(135deg, transparent 0 calc(50% - 1px), rgba(198,146,162,0.5) calc(50% - 1px) 50%, transparent 50%),
      linear-gradient(135deg, #f1e2cd 0 50%, transparent 50%);
    filter: drop-shadow(-2px -2px 3px rgba(178,124,142,0.34)); }
  /* washi tape holding it down */
  .lt-tape-t, .lt-tape-b { position: absolute; }
  /* 21px, not 26: with the sheet's top padding cut to 10px the taller strip reached 14px INTO the paper and
     sat on top of the flourish. Same weight as the bottom strip now, and it clears the marks by 2px. */
  .lt-tape-t { top: -13px; left: 50%; margin-left: -48px; width: 96px; height: 21px; transform: rotate(-2.5deg);
    background: repeating-linear-gradient(135deg, var(--lta, rgba(255,255,255,0.9)) 0 7px, var(--ltb, rgba(255,206,222,0.88)) 7px 14px);
    box-shadow: 0 2px 5px rgba(190,130,150,0.2); }
  /* on the LEFT now — at bottom right it sat straight on top of the folded corner and hid it */
  .lt-tape-b { bottom: -10px; left: 22px; width: 62px; height: 21px; transform: rotate(4deg);
    background: repeating-linear-gradient(135deg, var(--lta, rgba(255,255,255,0.9)) 0 7px, var(--ltb, rgba(255,240,200,0.88)) 7px 14px);
    box-shadow: 0 2px 5px rgba(190,130,150,0.16); }
  .lt-letter .add-back { top: 14px; left: 14px; z-index: 3; }
  /* heading. The date is dated in the corner the way you date a letter — top right, small — instead of
     sitting centred under the title, where it cost a whole line of empty paper before a word was read. */
  .lt-l-head { text-align: center; margin-bottom: 0; }
  .lt-l-flourish { font-size: 11px; letter-spacing: 3px; color: #dda9bc; line-height: 1; }
  /* 1.1 rather than 1.25: Parisienne's own font box is 43.6px at this size, so the extra leading was pure
     empty paper above the glyphs. The margin keeps its ascenders off the flourish. */
  .lt-l-title { font-family: "Parisienne", cursive; font-size: 34px; color: #cc6488; line-height: 1.1; margin-top: 12px; }
  .lt-l-date { position: absolute; top: 13px; right: 16px;
    font-family: "Caveat", cursive; font-size: 13px; color: #bd93a4; letter-spacing: 0.3px; }
  .lt-rule { display: flex; align-items: center; gap: 8px; margin: 10px 0 14px; color: #e5b3c4; font-size: 10px; }
  .lt-rule span.line { flex: 1; height: 1px;
    background: repeating-linear-gradient(90deg, #ecc3d1 0 5px, transparent 5px 10px); }
  /* the letter */
  .lt-l-greet { font-family: "Gochi Hand", cursive; font-size: 19px; color: #c0668a; margin-bottom: 12px; }
  /* THE RULED PART. The rules are drawn by the text block itself, so the first one is always 27px below the
     top of the first line rather than 27px below the top of the sheet — that offset is what put a line
     through the middle of the words. background-origin: content-box keeps it true even if this ever gains
     padding. */
  .lt-l-body {
    background-image: repeating-linear-gradient(180deg, transparent 0 27px, var(--lr, rgba(206,168,180,0.16)) 27px 28px);
    background-origin: content-box;
  }
  .lt-l-body p {
    /* the gap between paragraphs is a whole line, not 15px: anything off the 28px rhythm drifts every
       paragraph a little further off the rules until they run through the text again. */
    margin: 0 0 28px; font-family: "Caveat", cursive; font-weight: 500;
    font-size: 19px; line-height: 28px; color: #7b5361; text-wrap: pretty;
  }
  .lt-l-body p:last-child { margin-bottom: 0; }
  .lt-l-sign { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; margin-top: 22px; }
  .lt-l-sign .line { width: 88px; height: 1px;
    background: repeating-linear-gradient(90deg, #e0a8bd 0 6px, transparent 6px 11px); }
  .lt-l-name { font-family: "Parisienne", cursive; font-size: 27px; color: #c9527d; line-height: 1.3; }
  .lt-l-tail { display: flex; justify-content: center; gap: 12px; margin-top: 20px; font-size: 12px; color: #e7aec1; }
  .lt-close {
    display: block; width: 100%; margin: 26px 0 0; padding: 16px; border: none; border-radius: 999px;
    cursor: pointer; font-family: "Gochi Hand", cursive; font-size: 19px; color: #fff;
    background: linear-gradient(160deg,#f892b0,#e26e93); box-shadow: 0 8px 18px rgba(226,110,147,0.4);
  }

  /* reading + writing share the paper */
  .lt-paper { background: #fffdf6; border-style: solid; border-color: rgba(228,196,150,0.5); }
  .lt-head { text-align: center; margin-bottom: 16px; }
  .lt-title { font-family: "Snell Roundhand","Segoe Script",cursive; font-size: 30px; color: #cc6488; line-height: 1.2; }
  .lt-meta { font-family: "Bradley Hand","Segoe Print",cursive; font-size: 12px; color: #b08b99; margin-top: 2px; }
  .lt-body { font-family: "Bradley Hand","Segoe Print",cursive; font-size: 17px; line-height: 1.85; color: #6a4a54; }
  .lt-body p { margin: 0 0 15px; }
  .lt-sign { margin-top: 22px; text-align: right; font-family: "Snell Roundhand","Segoe Script",cursive; font-size: 24px; color: #a05a72; }
  /* the closing line of the letter: signature on the left, send on the right */
  /* THE LEFT EDGE. The message's box is flush with the card, but its writing starts 16.5px further in —
     1.5px of border plus 15px of padding. So "from ___" and the word count are inset by exactly that,
     and the signature sits on the same line the letter is written on rather than 16px to the left of it. */
  .lt-foot { display: flex; align-items: baseline; gap: 9px; margin-top: 18px; padding: 4px 16.5px 0; }
  .lt-fromlabel { font-family: "Snell Roundhand","Segoe Script",cursive; font-size: 21px; color: #a05a72; margin-right: 2px; }
  /* "from ____" reads as the closing line of the letter, so the field sits inline with the word and is
     signed in the same script the letter is signed in. Free text: sign it however you like. */
  .lt-fromin {
    flex: 1 1 90px; min-width: 0; box-sizing: border-box; padding: 6px 10px 4px;
    background: none; border: none; border-bottom: 1.5px dotted rgba(216,105,138,0.5); border-radius: 0;
    outline: none; color: #a05a72;
    font-family: "Snell Roundhand","Segoe Script",cursive; font-size: 22px; line-height: 1.15;
  }
  .lt-fromin::placeholder { color: rgba(160,90,114,0.4); }
  .lt-fromin:focus { border-bottom-color: #ff9dc2; }
  .lt-send {
    flex: 0 0 auto; margin-left: 6px; padding: 10px 20px; border: none; border-radius: 13px; cursor: pointer; color: #fff;
    font-family: "Bradley Hand","Segoe Print",cursive; font-size: 16px;
    background: linear-gradient(135deg, #ffa6c9, #d8698a); box-shadow: 0 7px 16px rgba(216,105,138,0.32);
  }
  .lt-send[disabled] { opacity: 0.55; }
  .lt-titlein, .lt-write {
    width: 100%; box-sizing: border-box; border: 1.5px solid rgba(216,105,138,0.28); border-radius: 13px;
    background: #fffdfc; outline: none; color: #6a4a54;
    font-family: "Bradley Hand","Segoe Print",cursive;
  }
  .lt-titlein { padding: 11px 14px; font-size: 15px; margin-bottom: 12px; }
  /* The title sits BESIDE the ← rather than below it: pushing it down left an empty band across the top of
     the page. Indented past the arrow (which occupies the first 34px of the content box) and narrowed to
     match, so the two read as one line. */
  /* The title clears the ← and so is indented past it by design — it is a header sitting beside the arrow,
     not part of the letter's own left edge. (Measured: its text starts 41px in from the writing's edge.
     Lining the two up would mean pushing the title below the arrow, which is the empty band at the top of
     the page we deliberately removed.) */
  .lt-writing .lt-titlein { margin: 2px 0 14px 42px; width: calc(100% - 42px); }
  .lt-writing .lt-write { min-height: 42vh; }
  /* the same ruled paper and the same hand the letter is read in, so what you write is what she sees */
  /* The paper simply GETS LONGER as you write (see growWrite): no scrolling inside it, no shrinking to fit
     the keyboard, nothing hidden while you type — the page scrolls, everything stays where it is and moves
     down together. resize is off because a hand-set height would be overwritten by the next keystroke. */
  .lt-write {
    padding: 13px 15px; min-height: 46vh; resize: none; overflow: hidden;
    font-family: "Caveat", cursive; font-weight: 500; font-size: 19px; line-height: 28px;
    background-color: var(--lp, #fffdf6);
    background-image: repeating-linear-gradient(180deg, transparent 0 27px, var(--lr, rgba(206,168,180,0.16)) 27px 28px);
    /* content-box, so the tiling starts where the TEXT starts and not 13px of padding above it — otherwise
       every rule sits halfway up a line of your own handwriting. */
    background-origin: content-box;
    /* local, so the ruling SCROLLS WITH THE WRITING. The default (scroll) pins the background to the box
       while the text moves inside it, so the two only agreed when the scroll position happened to land on an
       exact multiple of 28px — which is why the lines sat on the rules at the top of a letter and drifted
       further off them the more you wrote. */
    background-attachment: local;
    color: #7b5361;
  }
  .lt-titlein:focus, .lt-write:focus { border-color: #ff9dc2; }
  .lt-count { margin-top: 9px; padding: 0 16.5px; text-align: right;
    font-family: "Bradley Hand","Segoe Print",cursive; font-size: 11.5px; color: #b892a1; }

  /* ---------- dressing the letter ----------
     Paper, tape and a sticker — the same three choices whether you are writing it, reading it, or looking at
     it in the stack. Thumb-sized targets (the chips are 34px of ink in a 42px hit area), because this is a
     phone: a 22px swatch is a cursor size, not a finger size. */
  .lt-custom { margin-top: 12px; display: flex; flex-direction: column; gap: 4px; }
  .lt-crow { display: flex; align-items: center; gap: 2px; }
  .lt-clabel { flex: 0 0 auto; width: 52px; font-family: "Bradley Hand","Segoe Print",cursive;
    font-size: 12px; color: #a5808d; }
  .lt-chip {
    position: relative; width: 42px; height: 42px; padding: 0; border: none; background: none;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .lt-chip i {   /* the ink: the swatch itself */
    display: block; width: 32px; height: 32px; border-radius: 50%;
    box-shadow: 0 1px 3px rgba(190,130,150,0.28), inset 0 0 0 1px rgba(255,255,255,0.6);
  }
  .lt-chip.on::after { content: ""; position: absolute; inset: 4px; border-radius: 50%;
    box-shadow: 0 0 0 2.5px #e2789f; }
  .lt-chip svg { width: 26px; height: 26px; display: block; }
  .lt-cglyph { font-size: 19px; color: #cc6488; line-height: 1; }
  /* ---------- dressing it: the step between writing and sending ----------
     A real preview, not an impression of one: the envelope is the inbox's own markup and the sheet is the
     one she will read, both clipped to the top so the choice is visible without scrolling past a letter. */
  .lt-dress .lt-preview { margin: 2px 0 6px; }
  .lt-pv-env { padding: 0 2px 14px; }
  .lt-pv-env .lt-row { transform: rotate(-0.5deg); }
  .lt-pv-sheet { position: relative; max-height: 250px; overflow: hidden; }
  .lt-pv-sheet .lt-letter { animation: none; margin-top: 12px; }
  .lt-pv-sheet::after {   /* the sheet runs out of view rather than stopping with a hard edge */
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 74px; z-index: 6;
    background: linear-gradient(180deg, rgba(255,252,246,0) 0%, rgba(255,252,246,0.92) 72%, rgba(255,252,246,1) 100%);
    pointer-events: none;
  }
  .lt-dress .lt-custom { margin-top: 14px; }
  .lt-dfoot { margin-top: 16px; }
  .lt-dfoot .lt-send { width: 100%; padding: 15px; border-radius: 999px; font-size: 19px;
    font-family: "Gochi Hand", cursive; }
  .lt-chip.none i { background: #fffdf6; display: flex; align-items: center; justify-content: center; }
  .lt-chip.none i::after { content: ""; width: 18px; height: 1.5px; background: #d9aebe; transform: rotate(-45deg); }
  /* the sticker, as it sits on the letter: top right under the date, tilted, with its own little shadow */
  .lt-letter.has-sticker .lt-l-head { padding: 0 44px; }   /* keep the title centred AND clear of it */
  .lt-sticker { position: absolute; top: 40px; right: 13px; width: 40px; height: 40px;
    transform: rotate(9deg); filter: drop-shadow(0 2px 3px rgba(190,130,150,0.32)); pointer-events: none; }
  .lt-sticker svg { width: 100%; height: 100%; display: block; }

  /* ---------- the secret settings ---------- */
  .settings .add-inner { max-width: 460px; }
  .set-sec { margin: 18px 0 0; padding: 14px 15px 15px; border-radius: 16px;
    background: rgba(255,255,255,0.55); border: 1.5px solid rgba(228,168,190,0.4); }
  .set-h { font-family: "Snell Roundhand","Segoe Script",cursive; font-size: 23px; color: #cc6488; margin-bottom: 2px; }
  .set-p { font-family: "Bradley Hand","Segoe Print",cursive; font-size: 13.5px; line-height: 1.5; color: #8d6a76; margin: 0 0 10px; }
  .set-state { font-family: "Bradley Hand","Segoe Print",cursive; font-size: 13.5px; color: #a05a72; margin-bottom: 10px; }
  .set-state b { color: #cc6488; font-weight: 400; }
  .set-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .set-btn {
    padding: 10px 14px; border-radius: 13px; cursor: pointer; border: 1.5px solid rgba(216,105,138,0.32);
    background: #fff; color: #a05a72; font-family: "Bradley Hand","Segoe Print",cursive; font-size: 14px;
  }
  .set-btn:hover { background: #fff3f7; }
  .set-btn.sel { background: linear-gradient(135deg, #ffd9e6, #ffc2d6); border-color: #e290ad; color: #8c3f5c; }
  .set-btn.go { border: none; color: #fff; background: linear-gradient(135deg, #ffa6c9, #d8698a); box-shadow: 0 7px 16px rgba(216,105,138,0.32); }
  .set-btn[disabled] { opacity: 0.55; }
  .set-msg { min-height: 17px; margin-top: 9px; font-family: "Bradley Hand","Segoe Print",cursive; font-size: 12.5px; line-height: 1.45; color: #a5808d; }
  .set-msg.bad { color: #c2566f; }
  .set-note { font-family: "Bradley Hand","Segoe Print",cursive; font-size: 12.5px; line-height: 1.55; color: #a5808d; }

  /* ---------- customisation ----------
     A two-column grid (label · choices) rather than a label ABOVE each set of choices: that alone saves a
     line per setting, and it lines every set of choices up on one left edge so the eye runs straight down.
     Related pairs share a row separated by a .cgap — paper+edge, pin+its colour, from+size — which halves
     the row count again. Chips and swatches are a size down from the ones on the board editor. */
  .cust { display: grid; grid-template-columns: max-content 1fr; column-gap: 11px; row-gap: 10px; align-items: center; margin: 14px 0 4px; }
  .cust .cl { font: 13.5px "Bradley Hand","Segoe Print",cursive; color: #b07890; text-align: right; white-space: nowrap; letter-spacing: 0.3px; }
  .cust .cv { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .cust .opt { padding: 8px 13px; font-size: 14px; border-radius: 11px; line-height: 1.25; }
  /* Every glyph picker is a square the same size as a swatch, so each row keeps one rhythm.
     34px is a THUMB size, not a cursor size — an earlier pass had these at 22px, which fitted more on a
     line and was miserable to actually tap on a phone. Rows are allowed to wrap instead. */
  .cust .opt[data-g="doodle"], .cust .opt[data-g="pin"] {
    width: 34px; height: 34px; padding: 0; font-size: 18px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  /* ONE chip language across the app: the creator's swatches are round with the same pink ring the letters'
     dressing uses, so notes and letters read as dressed from one set of controls. The edge pair is the
     exception ON PURPOSE — it sets its own radius inline (that corner IS the choice), and an inline value
     out-ranks this rule, so those two stay square-and-round without a special case. */
  .cust .opt-swatch { width: 34px; height: 34px; border-radius: 50%; }
  .cust .opt[data-g="doodle"], .cust .opt[data-g="pin"] { border-radius: 50%; }
  .cust .opt-swatch.sel, .cust .opt[data-g="doodle"].sel, .cust .opt[data-g="pin"].sel {
    box-shadow: 0 0 0 2.5px #e2789f;
  }
  /* Finger-sized target without finger-sized ink: an invisible 4px skirt on every control takes the touch,

  }

  function renderWall() {
    var NOTES = notesInView(WALL_NOTES);
    var floaters = "";

      var sparkle = fi % 3 === 1;
      var fc = ["♡", "✧", "ᰔ", "❀", "˚"][fi % 5];

        left: Math.round(Math.random() * 94) + "%",

        fontSize: (10 + Math.round(Math.random() * 14)) + "px",
        color: "rgba(232,150,180," + (0.32 + Math.random() * 0.3).toFixed(2) + ")",
        animation: sparkle
