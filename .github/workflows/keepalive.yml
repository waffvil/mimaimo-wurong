name: Keep Supabase awake

# Supabase pauses a Free project that doesn't see enough database activity over a 7-day window. Their docs
# are specific about what "enough" means:
#
#   "Typically a few user requests to the database each day over the previous week is enough to keep the
#    project from being paused."   — supabase.com/docs/guides/platform/free-project-pausing
#
# So it is FREQUENCY that counts, not volume: one big request (or one huge write, then deleting it) is still
# one request. The old schedule ran once every three days — two or three requests a WEEK — and the project
# was flagged for pausing anyway, despite every run succeeding. It now runs three times a day and makes a
# handful of requests each time, which is comfortably inside what they ask for.
#
# It reads, and it writes one row into public.keepalive — its own table, chosen deliberately:
#   · public.letters has an after-insert trigger that PUSHES A NOTIFICATION to the other phone. A keepalive
#     letter would ping her three times a day, forever, including at 6am.
#   · anything in notes or letters would also show up on the board, in the inbox and in the tidying list.
# public.keepalive has no trigger and no screen, so nothing it does can be seen or heard.

on:
  schedule:
    - cron: "17 6 * * *"    # 06:17 UTC
    - cron: "23 13 * * *"   # 13:23 UTC   (odd minutes on purpose: GitHub's cron
    - cron: "41 20 * * *"   # 20:41 UTC    queue is busiest on the hour)
  workflow_dispatch:        # and by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: A few requests to the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          ping () {   # $1 = path, $2 = what it is
            code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --max-time 20 "$SUPABASE_URL/rest/v1/$1" \
              -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
            echo "  $2 -> HTTP $code"
            case "$code" in 2*) return 0;; *) return 1;; esac
          }
          ping "notes?select=id&order=created_at.desc&limit=1"   "newest note"
          ping "letters?select=id&order=created_at.desc&limit=1" "newest letter"
          ping "notes?select=id"                                 "every note id"
          ping "push_subs?select=who"                            "who's registered"

          # a write as well as reads — and a prune, so this table can never grow. Both are requests too.
          stamp=$(date -u +%FT%TZ)
          curl --silent --show-error --fail --output /dev/null \
            --max-time 20 -X POST "$SUPABASE_URL/rest/v1/keepalive" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"who\":\"github actions $stamp\"}"
          echo "  wrote a keepalive row"

          cutoff=$(date -u -d '3 days ago' +%FT%TZ 2>/dev/null || date -u -v-3d +%FT%TZ)
          curl --silent --show-error --fail --output /dev/null \
            --max-time 20 -X DELETE "$SUPABASE_URL/rest/v1/keepalive?at=lt.$cutoff" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY"
          echo "  pruned anything older than $cutoff"

          echo "Supabase pinged six times — kept awake, and nobody was notified. 🌸"
